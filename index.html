<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pianificazione Medici</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230a162d'/><path d='M50 75 C50 75 20 55 20 35 C20 25 28 18 38 20 C43 21 47 25 50 30 C53 25 57 21 62 20 C72 18 80 25 80 35 C80 55 50 75 50 75Z' fill='%233b82f6'/><polyline points='28,50 36,38 44,56 52,32 60,50 68,44 76,50' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1020; --bg2:#0f1629; --card:#131b30; --card2:#18223c;
  --line:rgba(148,163,184,.14); --line2:rgba(148,163,184,.26);
  --text:#e8edf8; --muted:#8392b0;
  --mat:#34d399; --pom:#fbbf24; --blue:#60a5fa;
  --radius:1.25rem;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
html,body{width:100%;height:100%;overflow:hidden;color:var(--text);
  background:var(--bg);font-family:'Inter','Segoe UI',Arial,sans-serif;
  -webkit-font-smoothing:antialiased}

#rainbow-bar{position:fixed;top:0;left:0;width:100%;height:3px;z-index:10000;
  background:linear-gradient(90deg,#34d399,#60a5fa,#a78bfa,#fbbf24,#34d399);
  background-size:400% 100%;animation:slideBar 10s linear infinite}
@keyframes slideBar{0%{background-position:0 0}100%{background-position:400% 0}}

/* HEADER */
#header{position:fixed;top:3px;left:0;width:100%;height:5.75rem;z-index:9998;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 2.25rem;
  background:var(--bg2);border-bottom:1px solid var(--line)}
#brand{display:flex;align-items:center;gap:1.125rem;min-width:0}
#footer-logo-img{height:3.625rem;width:auto;backface-visibility:hidden}
#brand-title{font-size:1.375rem;font-weight:600;color:var(--muted);line-height:1.2;
  padding-left:1.125rem;border-left:1px solid var(--line2)}
#data-completa{font-size:2.75rem;font-weight:700;letter-spacing:-.5px;text-align:center;
  white-space:pre;color:var(--text)}
#clock{display:flex;align-items:center;justify-content:flex-end;gap:0.25rem}
.clock-block{display:flex;gap:0.25rem}
.digit{width:2.875rem;height:4rem;display:flex;align-items:center;justify-content:center;
  font-size:3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;
  background:var(--card);border:1px solid var(--line);border-radius:0.625rem}
.sep{font-size:2.75rem;font-weight:700;color:var(--blue);padding:0 0.25rem;line-height:1;
  animation:blink 1s step-end infinite;position:relative;top:-3px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.digit-sec{display:flex;align-items:flex-end;padding-bottom:0.375rem;margin-left:0.375rem}
.digit-sec .d{font-size:1.75rem;font-weight:600;color:var(--muted);width:1.1875rem;text-align:center;
  font-variant-numeric:tabular-nums}

#loader-bar{position:fixed;top:5.9375rem;left:0;height:2px;width:0;z-index:9997;opacity:0;
  background:linear-gradient(90deg,#60a5fa,#a78bfa);transition:opacity .3s}
#loader-bar.running{opacity:1;animation:loadAnim 3s linear forwards}
@keyframes loadAnim{0%{width:0}80%{width:90%}100%{width:90%}}

/* VIEWER */
#viewer-wrap{position:fixed;top:6.125rem;bottom:3rem;left:0;right:0;overflow-y:auto;overflow-x:hidden;
  z-index:1;background:var(--bg);
  background-image:radial-gradient(ellipse 60% 40% at 15% 0,rgba(52,211,153,.07),transparent 70%),
                   radial-gradient(ellipse 60% 40% at 85% 100%,rgba(96,165,250,.07),transparent 70%)}
#turni-container{padding:1.125rem 1.75rem;height:100%;display:flex;flex-direction:column}

/* FOOTER (barra di stato) */
#footer{position:fixed;bottom:0;left:0;width:100%;height:3rem;z-index:9998;
  display:flex;align-items:center;justify-content:space-between;padding:0 2.25rem;
  background:var(--bg2);border-top:1px solid var(--line);font-size:1.125rem;color:var(--muted)}
#refresh-status,#next-refresh{display:flex;align-items:center;gap:0.625rem}
#refresh-icon{font-size:1.25rem;color:#22c55e;display:inline-block}
#refresh-icon.spinning{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#next-refresh b{font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.legend{display:flex;align-items:center;gap:1.375rem}
.legend span{display:flex;align-items:center;gap:0.5rem}
.legend i{width:0.6875rem;height:0.6875rem;border-radius:50%;display:inline-block}

/* GRID */
.main-grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:1.125rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;display:flex;flex-direction:column;min-height:0}

.card-hdr{display:flex;align-items:center;gap:0.875rem;padding:1rem 1.5rem;
  font-size:2.125rem;font-weight:700;letter-spacing:-.3px;border-bottom:1px solid var(--line)}
.card-hdr::before{content:"";width:0.75rem;height:0.75rem;border-radius:50%;background:currentColor;
  box-shadow:0 0 0 0.375rem color-mix(in srgb,currentColor 18%,transparent)}
.card-hdr.green{color:var(--mat);background:linear-gradient(180deg,rgba(52,211,153,.12),transparent)}
.card-hdr.orange{color:var(--pom);background:linear-gradient(180deg,rgba(251,191,36,.12),transparent)}

.hdr-time{margin-left:auto;font-size:1.75rem;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;
  padding:2px 1rem;border-radius:0.75rem;background:rgba(255,255,255,.06);border:1px solid var(--line2)}
.section-label{padding:1rem 1.5rem 0.25rem;border:none}
.tc-label,.ecg-label{display:inline-block;font-size:1.1875rem;font-weight:600;letter-spacing:.2px;
  padding:0.25rem 0.875rem;border-radius:62.4375rem;text-shadow:none;text-transform:none}
.tc-label{background:rgba(96,165,250,.14);color:#93c5fd;border:1px solid rgba(96,165,250,.35)}
.ecg-label{background:rgba(52,211,153,.12);color:#6ee7b7;border:1px solid rgba(52,211,153,.32)}

.doc-section{padding:0.5rem 1.5rem 1rem;display:flex;flex-direction:column;align-items:flex-start;
  justify-content:flex-start;gap:0.5rem}
#wrap-tc-mattina,#wrap-tc-pomeriggio{min-height:8.125rem}
.doc-name{font-size:2.875rem;font-weight:700;line-height:1.35;text-align:left;letter-spacing:-.3px}
.doc-empty,.esame-empty{font-size:1.875rem;color:var(--muted);font-style:normal;font-weight:500}

/* righe ECG */
.ecg-row{display:flex;flex-wrap:wrap;align-items:center;row-gap:0.375rem;padding:0.75rem 1.5rem;
  border-top:1px solid var(--line)}
.ecg-row:first-child{border-top:none}
.ecg-doc-wrap{flex:1 1 13.75rem;display:flex;align-items:center;gap:0.625rem;min-width:0;flex-wrap:wrap}
.ecg-row .ecg-doctor{font-size:2.625rem;font-weight:700;letter-spacing:-.3px;text-shadow:none}
.ecg-row .ecg-time{font-size:2.125rem;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;
  white-space:nowrap;background:var(--card2);border:1px solid var(--line2);border-radius:0.75rem;
  padding:3px 0.875rem;margin-left:auto;text-shadow:none}
.ecg-status-dot{width:1rem;height:1rem;border-radius:50%;flex-shrink:0;margin-right:1rem;
  transition:background .6s,box-shadow .6s}
.ecg-status-dot.green{background:#34d399;box-shadow:0 0 0 0.3125rem rgba(52,211,153,.2)}
.ecg-status-dot.yellow{background:#fbbf24;box-shadow:0 0 0 0.3125rem rgba(251,191,36,.2);animation:pulse 1.4s ease infinite}
.ecg-status-dot.red{background:#f87171;box-shadow:0 0 0 0.3125rem rgba(248,113,113,.15)}
.ecg-status-dot.gray{background:#475569}
.ecg-badge-chip{display:inline-flex;align-items:center;font-size:1.25rem;font-weight:700;
  padding:2px 0.625rem;border-radius:0.5rem;white-space:nowrap;border:1px solid;
  background:rgba(248,113,113,.14);color:#fca5a5;border-color:rgba(248,113,113,.35)}
.ecg-badge-chip.ecg-75{background:rgba(34,211,238,.13);color:#67e8f9;border-color:rgba(34,211,238,.38)}
.ecg-badge-chip.ecg-200{background:rgba(251,146,60,.16);color:#fdba74;border-color:rgba(251,146,60,.5)}
.ecg-badge-chip.ecg-150{background:rgba(167,139,250,.16);color:#c4b5fd;border-color:rgba(167,139,250,.5)}

/* ESAMI: quattro schede impilate */
.esami-grid{background:none;border:none;border-radius:0;overflow:visible;gap:0.875rem}
.esame-block{flex:1 1 0;min-height:0;display:flex;flex-direction:column;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;border-left-width:0.375rem}
.esame-block + .esame-block{border-top:1px solid var(--line)}
.esame-block:nth-child(1){border-left-color:#f472b6}
.esame-block:nth-child(2){border-left-color:#fbbf24}
.esame-block:nth-child(3){border-left-color:#60a5fa}
.esame-block:nth-child(4){border-left-color:#a78bfa}
/* Holter: occupano lo spazio libero; Spiro e Polisonnografia: solo quanto serve */
.esame-block:nth-child(1),.esame-block:nth-child(2){flex:2 1 0}
.esame-block:nth-child(3),.esame-block:nth-child(4){flex:0 0 auto}
.esame-block:nth-child(3) .esame-body,.esame-block:nth-child(4) .esame-body{flex:none;font-size:2.125rem;padding-bottom:0.625rem}
.esame-block:nth-child(3) .esame-hdr,.esame-block:nth-child(4) .esame-hdr{padding-top:0.625rem;font-size:1.375rem}
.esame-hdr{padding:0.75rem 1.375rem 0;font-size:1.5625rem;font-weight:600;letter-spacing:0;
  background:none;border:none;text-shadow:none;color:var(--muted)}
.esame-hdr.pink{color:#f9a8d4}.esame-hdr.amber{color:#fcd34d}
.esame-hdr.sky{color:#93c5fd}.esame-hdr.violet{color:#c4b5fd}
.esame-body{padding:0.25rem 1.375rem 0.75rem;font-size:2.375rem;font-weight:700;line-height:1.4;letter-spacing:-.2px;
  text-shadow:none;columns:2;column-gap:1.25rem;flex:1}
.esame-body{min-height:0;overflow:hidden}
.esame-body .n span[style*="font-size"]{font-size:.55em!important}
.esame-body .n{display:block;padding:1px 0;break-inside:avoid}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){#rainbow-bar,.sep{animation:none}}

/* ═══ RESTYLING 2 — vetro, profondità, luce ═══ */
:root{--glass:linear-gradient(160deg,rgba(32,45,80,.62),rgba(14,21,40,.88))}
html,body{background:#070b16}
#viewer-wrap{background:
  radial-gradient(56.25rem 32.5rem at 8% -8%,rgba(52,211,153,.16),transparent 65%),
  radial-gradient(56.25rem 35rem at 52% 115%,rgba(251,191,36,.10),transparent 65%),
  radial-gradient(62.5rem 40rem at 100% 0%,rgba(99,102,241,.18),transparent 62%),
  #070b16}
#header{background:linear-gradient(180deg,rgba(20,30,58,.96),rgba(10,16,32,.96));
  border-bottom:1px solid rgba(148,163,184,.16);box-shadow:0 0.75rem 2.5rem -1.125rem rgba(96,165,250,.45)}
#header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(96,165,250,.7),rgba(167,139,250,.7),transparent)}
#data-completa{font-size:2.875rem;font-weight:800;letter-spacing:-1px;
  background:linear-gradient(180deg,#fff 30%,#a9bbe0);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent}
.digit{background:linear-gradient(180deg,#1d2a4d,#111a33);border:1px solid rgba(148,163,184,.22);
  border-radius:0.75rem;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0.5rem 1.25rem -0.625rem rgba(0,0,0,.8);
  position:relative}
.digit::after{content:"";position:absolute;left:0.375rem;right:0.375rem;top:50%;height:1px;background:rgba(0,0,0,.35)}
.digit-sec .d{color:#60a5fa;text-shadow:0 0 1rem rgba(96,165,250,.6)}
#brand-title{background:linear-gradient(90deg,#cbd5f5,#7f8fb5);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;font-weight:700}

.card{background:var(--glass);border:1px solid rgba(148,163,184,.16);border-radius:1.5rem;position:relative;
  box-shadow:0 1.875rem 3.75rem -1.875rem rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.07);
  animation:cardIn .7s cubic-bezier(.2,.7,.2,1) both}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}
@keyframes cardIn{from{opacity:0;transform:translateY(0.875rem)}to{opacity:1;transform:none}}
.esami-grid{background:none;border:none;box-shadow:none;animation:none}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;opacity:.9}
.card:nth-child(1)::before{background:linear-gradient(90deg,#34d399,#2dd4bf,transparent)}
.card:nth-child(2)::before{background:linear-gradient(90deg,#fbbf24,#fb923c,transparent)}
.esami-grid::before{display:none}

.card-hdr{padding:1.25rem 1.625rem;font-size:2.375rem;font-weight:800;letter-spacing:-.6px;border-bottom:1px solid rgba(148,163,184,.12)}
.card-hdr::before{width:1rem;height:1rem;background:radial-gradient(circle at 35% 30%,#fff,currentColor 55%);
  box-shadow:0 0 0 0.4375rem color-mix(in srgb,currentColor 16%,transparent),0 0 1.75rem currentColor}
.card-hdr.green{background:linear-gradient(100deg,rgba(52,211,153,.20),transparent 70%)}
.card-hdr.orange{background:linear-gradient(100deg,rgba(251,191,36,.20),transparent 70%)}
.hdr-time{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:62.4375rem;
  padding:0.25rem 1.125rem;font-size:1.6875rem;color:#e8edf8;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}

.section-label{padding:1.25rem 1.625rem 0.375rem}
.tc-label,.ecg-label{font-size:1.125rem;font-weight:700;padding:0.3125rem 1rem;letter-spacing:.3px}
.doc-section{padding:0.5rem 1.625rem 1.125rem}
.doc-name{font-size:3rem;font-weight:800;line-height:1.3;text-shadow:0 2px 1.5rem rgba(96,165,250,.25)}

.ecg-row{margin:0.4375rem 1.125rem 0;padding:0.75rem 1.125rem;border:1px solid rgba(148,163,184,.14);border-radius:1.125rem;
  background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  box-shadow:0 0.625rem 1.5rem -1rem rgba(0,0,0,.8)}
.ecg-row:first-child{border-top:1px solid rgba(148,163,184,.14)}
.doc-section .ecg-row:last-child{margin-bottom:1.125rem}
.ecg-row .ecg-doctor{font-size:2.625rem;font-weight:800}
.ecg-row .ecg-time{background:rgba(96,165,250,.12);border:1px solid rgba(96,165,250,.38);color:#dbeafe;
  border-radius:0.875rem;font-size:2.125rem;font-weight:800;padding:0.25rem 1rem}
.ecg-badge-chip{border-radius:62.4375rem;padding:3px 0.75rem}

.esame-block{background:var(--glass);border:1px solid rgba(148,163,184,.16);border-left-width:1px;border-radius:1.5rem;
  box-shadow:0 1.875rem 3.75rem -2.125rem rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.07);position:relative;
  animation:cardIn .7s .24s cubic-bezier(.2,.7,.2,1) both}
.esame-block::before{content:"";position:absolute;left:0;top:1.125rem;bottom:1.125rem;width:0.3125rem;border-radius:0 0.375rem 0.375rem 0;
  background:var(--ac);box-shadow:0 0 1.375rem var(--ac)}
.esame-block:nth-child(1){--ac:#f472b6}.esame-block:nth-child(2){--ac:#fbbf24}
.esame-block:nth-child(3){--ac:#60a5fa}.esame-block:nth-child(4){--ac:#a78bfa}
.esame-hdr{padding:1rem 1.625rem 0;font-size:1.625rem;font-weight:800;letter-spacing:-.2px}
.esame-block:nth-child(3) .esame-hdr,.esame-block:nth-child(4) .esame-hdr{font-size:1.375rem;padding-top:0.75rem}
.esame-body{padding:0.375rem 1.625rem 0.875rem;font-weight:800}
.esame-body .n:not([style*="column-span"])::before{content:"";display:inline-block;width:.2em;height:.2em;
  border-radius:50%;background:currentColor;opacity:.55;margin-right:.45em;vertical-align:.22em}
.doc-empty,.esame-empty{opacity:.6}

#footer{background:linear-gradient(0deg,rgba(14,21,42,.98),rgba(9,14,28,.98));border-top:1px solid rgba(148,163,184,.14)}
#refresh-icon{filter:drop-shadow(0 0 0.375rem currentColor)}
@media (prefers-reduced-motion:reduce){.card,.esame-block{animation:none}}
.card-hdr::before{display:none}

/* ═══ SCALA RIDOTTA PER TV 65" (Holter cardiaco invariato) ═══ */
#header{height:4.375rem;padding:0 1.75rem}
#loader-bar{top:4.5625rem}
#viewer-wrap{top:4.75rem;bottom:2.25rem}
#turni-container{padding:0.875rem 1.375rem}
#footer{height:2.25rem;font-size:0.875rem;padding:0 1.75rem}
#refresh-icon{font-size:0.9375rem}
#footer-logo-img{height:2.625rem}
#brand{gap:0.875rem}
#brand-title{font-size:0.9375rem;padding-left:0.875rem}
#data-completa{font-size:2.125rem}
.digit{width:2.125rem;height:3rem;font-size:2.25rem;border-radius:0.5625rem}
.sep{font-size:2rem}
.digit-sec .d{font-size:1.25rem;width:0.875rem}
.digit-sec{padding-bottom:0.25rem}

.main-grid{gap:0.875rem}
.card-hdr{padding:0.8125rem 1.375rem;font-size:1.75rem}
.hdr-time{font-size:1.25rem;padding:3px 0.875rem}
.section-label{padding:0.875rem 1.375rem 0.25rem}
.tc-label,.ecg-label{font-size:0.875rem;padding:3px 0.75rem}
.doc-section{padding:0.375rem 1.375rem 0.875rem}
#wrap-tc-mattina,#wrap-tc-pomeriggio{min-height:5.625rem}
.doc-name{font-size:2.125rem}
.doc-empty,.esame-empty{font-size:1.375rem}
.ecg-row{margin:0.375rem 0.875rem 0;padding:0.5625rem 0.875rem;border-radius:0.875rem}
.doc-section .ecg-row:last-child{margin-bottom:0.875rem}
.ecg-row .ecg-doctor{font-size:1.875rem}
.ecg-row .ecg-time{font-size:1.5rem;padding:3px 0.75rem;border-radius:0.6875rem}
.ecg-badge-chip{font-size:0.9375rem;padding:2px 0.5625rem}
.ecg-status-dot{width:0.75rem;height:0.75rem;margin-right:0.75rem}

/* Esami: HC invariato (nome 2.375rem), gli altri ridotti */
.esami-grid{gap:0.75rem}
.esame-block:nth-child(1),.esame-block:nth-child(2){flex:2 1 0}
.esame-block:nth-child(1) .esame-hdr,.esame-block:nth-child(2) .esame-hdr{font-size:1.1875rem;padding:0.75rem 1.375rem 0}
.esame-block:nth-child(1) .esame-body,.esame-block:nth-child(2) .esame-body{font-size:1.75rem;padding:0.25rem 1.375rem 0.625rem}
.esame-block:nth-child(3) .esame-hdr,.esame-block:nth-child(4) .esame-hdr{font-size:1.0625rem;padding:0.625rem 1.375rem 0}
.esame-block:nth-child(3) .esame-body,.esame-block:nth-child(4) .esame-body{font-size:1.625rem;padding:0.25rem 1.375rem 0.625rem}
.esame-body .n[style*="column-span"]{font-size:.6875rem!important}
.main-grid{grid-template-rows:minmax(0,1fr)}

/* Turni: misure relative al contenitore, così si possono ridurre senza "zoom" */
.doc-section{font-size:1rem}
.doc-name{font-size:2.125em}
.ecg-row{margin:.375em .875em 0;padding:.5625em .875em;border-radius:.875em}
.doc-section .ecg-row:last-child{margin-bottom:.875em}
.ecg-row .ecg-doctor{font-size:1.875em}
.ecg-row .ecg-time{font-size:1.5em;padding:.125em .5em;border-radius:.46em}
.ecg-badge-chip{font-size:.9375em;padding:.13em .6em}
.ecg-status-dot{width:.75em;height:.75em;margin-right:.75em}
.doc-empty{font-size:1.375em}

/* Turno completo ed ECG: schede separate e indipendenti */
.col{display:flex;flex-direction:column;gap:14px;min-height:0}
.col .card.tc{flex:0 1 auto;max-height:46%}
.col .card.ecg{flex:1 1 0;min-height:0}
.col.mat .card::before{background:linear-gradient(90deg,#34d399,#2dd4bf,transparent)}
.col.pom .card::before{background:linear-gradient(90deg,#fbbf24,#fb923c,transparent)}
.card-hdr.sub{font-size:1.375rem;padding:.7rem 1.4rem;font-weight:700}
.card.ecg .doc-section{padding-top:.4rem}

<script>

var REFRESH_INTERVAL_MS = 5000; // 5 secondi — aggiornamento live

function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function padTime(t) {
  if (!t) return t;
  var parts = t.split(':');
  if (parts.length < 2) return t;
  return pad2(parseInt(parts[0], 10)) + ':' + parts[1];
}

var GIORNI = ['Domenica','Lunedi','Martedi','Mercoledi','Giovedi','Venerdi','Sabato'];
var MESI   = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

var lastUpdated = null;

/* ── LOADER BAR ── */
function startLoaderBar() {
  var bar = document.getElementById('loader-bar');
  bar.className = '';
  bar.style.width = '0%';
  void bar.offsetWidth;
  bar.className = 'running';
}
function stopLoaderBar() {
  var bar = document.getElementById('loader-bar');
  bar.style.width = '100%';
  bar.style.opacity = '0';
  setTimeout(function() { bar.className = ''; bar.style.width = '0%'; bar.style.opacity = ''; }, 400);
}

/* ── ICONA REFRESH ── */
function setRefreshIcon(loading) {
  var icon = document.getElementById('refresh-icon');
  if (loading) {
    icon.innerHTML = '&#x21BB;';
    icon.className = 'spinning';
    icon.style.color = '#3b82f6';
  } else {
    icon.innerHTML = '&#x2714;';
    icon.className = '';
    icon.style.color = '#22c55e';
  }
}

/* ── STATUS ── */
function updateRefreshStatus() {
  if (!lastUpdated) return;
  document.getElementById('refresh-text').textContent =
    'Aggiornato alle ' + pad2(lastUpdated.getHours()) + ':' + pad2(lastUpdated.getMinutes());
}

function updateNextRefresh() {
  if (!nextRefresh) return;
  var diff = Math.max(0, Math.floor((nextRefresh - Date.now()) / 1000));
  var mm = Math.floor(diff / 60);
  var ss = diff % 60;
  var nr = new Date(nextRefresh);
  document.getElementById('next-time').textContent = pad2(nr.getHours()) + ':' + pad2(nr.getMinutes());
  document.getElementById('countdown').textContent = 'tra ' + pad2(mm) + ':' + pad2(ss);
}

/* ── OROLOGIO ── */
function updateClock() {
  var now = new Date();
  var h = pad2(now.getHours());
  var m = pad2(now.getMinutes());
  var s = pad2(now.getSeconds());
  document.getElementById('h1').textContent = h[0];
  document.getElementById('h2').textContent = h[1];
  document.getElementById('m1').textContent = m[0];
  document.getElementById('m2').textContent = m[1];
  document.getElementById('s1').textContent = s[0];
  document.getElementById('s2').textContent = s[1];

  var g  = GIORNI[now.getDay()];
  var d  = now.getDate();
  var me = MESI[now.getMonth()];
  var y  = now.getFullYear();
  document.getElementById('data-completa').textContent = g + '  ' + d + ' ' + me + ' ' + y;

  updateNextRefresh();
}

function getMondayOfWeek(d) {
  var copy = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var dow = copy.getDay();
  var diff = (dow === 0) ? -6 : 1 - dow;
  copy.setDate(copy.getDate() + diff);
  var y = copy.getFullYear();
  var m = String(copy.getMonth() + 1).padStart(2, '0');
  var day = String(copy.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function getTodayDayIdx() {
  var dow = new Date().getDay();
  return (dow === 0) ? 6 : dow - 1; // 0=Lun ... 5=Sab

function getSlotForDay(dayIdx, session) {
  return dayIdx + '_' + session;
}

// getSlotData: legge slots[dayIdx] come oggetto o stringa (compatibile con Supabase/Situazione-medici)
function getSlotData(slots, dayIdx) {
  if (!slots) return null;
  if (Array.isArray(slots)) return slots[dayIdx] || null;
  if (typeof slots === 'object') return slots[String(dayIdx)] || null;
  return null;
}

// holterConfType: riconosce la conferma del turno holter.
// 'std' = confermato (HC + HP), 'c16' = confermato holter da 16 (solo HC, max 16), null = non confermato
function holterConfType(slot) {
  if (!slot) return null;
  var s = (typeof slot === 'string') ? slot
        : (slot.stato || slot.status || slot.val || slot.value || slot.tipo || slot.type || '');
  s = String(s).toLowerCase().replace(/\s+/g, '');
  if (s === 'confermato') return 'std';
  if (s.indexOf('16') !== -1 && (s.indexOf('conferm') !== -1 || s.charAt(0) === 'c')) return 'c16';
  return null;
}

function parseOrario(val) {
  if (!val) return null;
  // Se è già un oggetto nel formato atteso {mattina, pomeriggio, generic}
  if (typeof val === 'object') {
    if (val.mattina || val.pomeriggio || val.generic) return val;
    // Oggetto {start, end} → generico
    if (val.start !== undefined) return { generic: { start: val.start || '', end: val.end || '' } };
    return null;
  }
  var s = String(val).trim();
  // Formato "HH:MM-HH:MM" o "HH:MM – HH:MM"
  var rangeMatch = s.match(/^(\d{1,2}:\d{2})\s*[-\u2013]\s*(\d{1,2}:\d{2})$/);
  if (rangeMatch) return { generic: { start: rangeMatch[1], end: rangeMatch[2] } };
  // Singola ora "HH:MM"
  var timeMatch = s.match(/^(\d{1,2}:\d{2})$/);
  if (timeMatch) return { generic: { start: timeMatch[1], end: '' } };
  return null;
}

function resolveOrario(docData, dayIdx, session) {
  if (!docData) return null;
  // Cerca campo orario nell'oggetto docData (da Firebase RTDB weeks)
  var orarioData = docData.orario || docData.orario_ecg || null;
  if (orarioData) {
    if (typeof orarioData === 'string') return parseOrario(orarioData);
    if (typeof orarioData === 'object') {
      if (orarioData.mattina || orarioData.pomeriggio || orarioData.generic) return orarioData;
      var sess = session && orarioData[session];
      if (sess) return { generic: { start: sess.start || String(sess), end: sess.end || '' } };
    }
  }
  // Campi specifici per sessione: orario_mattina_start / orario_pomeriggio_start
  var sessKey = session || 'mattina';
  var sf = 'orario_' + sessKey + '_start', ef = 'orario_' + sessKey + '_end';
  if (docData[sf]) return { generic: { start: docData[sf], end: docData[ef] || '' } };
  // Campi generici: orario_start / orario_end
  if (docData.orario_start) return { generic: { start: docData.orario_start, end: docData.orario_end || '' } };
  return null;
}

function matchCardiologo(name, list) {
  if (!list || !list.length) return null;
  var n = (name || '').toLowerCase().trim();
  for (var i = 0; i < list.length; i++) {
    var item = list[i];
    var ln = ((item.nome || item.name || '') + ' ' + (item.cognome || '')).toLowerCase().trim();
    if (ln === n || (item.cognome || '').toLowerCase() === n) return item;
    if ((item.label || '').toLowerCase().includes(n) || n.includes((item.cognome || '').toLowerCase())) return item;
  }
  return null;
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fetchAllData(callback) {
  var weekKey = getMondayOfWeek(new Date());
  var pending = 10;
  var results = {};

  function done(key, val) {
    results[key] = val;
    pending--;
    if (pending === 0) callback(results);
  }

  // ── Supabase: holter_counts ──────────────────────────────────────────────
  var holterUrl = SUPABASE_URL + '/rest/v1/holter_counts?week_key=eq.' + encodeURIComponent(weekKey) + '&select=*';
  fetch(holterUrl, { headers: _sbHeaders })
    .then(function(r) { return r.json(); })
    .then(function(rows) {
      var d = (rows && rows[0]) || {};
      var hcMap = {}, hcExists = {};
      var hcRaw = d.hc || {};
      Object.keys(hcRaw).forEach(function(k) {
        var n = parseInt(hcRaw[k]); if (!isNaN(n)) { hcMap[k] = n; hcExists[k] = true; }
      });
      var hpMap = {}, hpExists = {};
      var hpRaw = d.hp || {};
      Object.keys(hpRaw).forEach(function(k) {
        var n = parseInt(hpRaw[k]); if (!isNaN(n)) { hpMap[k] = n; hpExists[k] = true; }
      });
      var spMap = {}, spExists = {};
      var spRaw = d.spiro || {};
      Object.keys(spRaw).forEach(function(k) {
        var n = parseInt(spRaw[k]); if (!isNaN(n) && n > 0) { spMap[k] = n; spExists[k] = true; }
      });
      var plMap = {}, plExists = {};
      var plRaw = d.pls || {};
      Object.keys(plRaw).forEach(function(k) {
        var n = parseInt(plRaw[k]); if (!isNaN(n) && n > 0) { plMap[k] = n; plExists[k] = true; }
      });
      results.hcCountsMap     = hcMap;    results.hcCountsExists    = hcExists;
      results.hpCountsMap     = hpMap;    results.hpCountsExists    = hpExists;
      results.spiroCountsMap  = spMap;    results.spiroCountsExists = spExists;
      results.plsCountsMap    = plMap;    results.plsCountsExists   = plExists;
      results.ecgTimesRaw     = d.ecg_times || {};
      done('ecgTimes', results.ecgTimesRaw);
    })
    .catch(function(e) {
      console.warn('holter_counts fetch error:', e);
      results.hcCountsMap = {}; results.hcCountsExists = {};
      results.hpCountsMap = {}; results.hpCountsExists = {};
      results.spiroCountsMap = {}; results.spiroCountsExists = {};
      results.plsCountsMap = {}; results.plsCountsExists = {};
      results.ecgTimesRaw = {};
      done('ecgTimes', {});
    });

  // ── Supabase: kv_store → turni_medici/turni ──────────────────────────────
  var turniUrl = SUPABASE_URL + '/rest/v1/kv_store?id=eq.turni_medici%2Fturni&select=data';
  fetch(turniUrl, { headers: _sbHeaders })
    .then(function(r) { return r.json(); })
    .then(function(rows) {
      var data = (rows && rows[0] && rows[0].data) || {};
      done('turni', data.lista || []);
    })
    .catch(function(e) { console.warn('turni fetch error:', e); done('turni', []); });

  // ── Supabase: kv_store → turni_medici/cardiologists ──────────────────────
  var cardUrl = SUPABASE_URL + '/rest/v1/kv_store?id=eq.turni_medici%2Fcardiologists&select=data';
  fetch(cardUrl, { headers: _sbHeaders })
    .then(function(r) { return r.json(); })
    .then(function(rows) {
      var data = (rows && rows[0] && rows[0].data) || {};
      done('cardiologists', data.lista || []);
    })
    .catch(function(e) { console.warn('cardiologists fetch error:', e); done('cardiologists', []); });
  // ── Supabase: kv_store → ecg_orari/{weekKey} ─────────────────────────
  var ecgOrariUrl = SUPABASE_URL + '/rest/v1/kv_store?id=eq.' + encodeURIComponent('ecg_orari/' + weekKey) + '&select=data';
  fetch(ecgOrariUrl, { headers: _sbHeaders })
    .then(function(r) { return r.json(); })
    .then(function(rows) {
      var d = (rows && rows[0] && rows[0].data) || null;
      done('ecgOrari', d);
    })
    .catch(function(e) { console.warn('ecg_orari fetch error:', e); done('ecgOrari', null); });

  // ── Supabase cardio_state (priorità) + Firebase RTDB (fallback) ──
  var rtdbPaths = ['weeks', 'holterWeeks', 'hcWeeks', 'hpWeeks', 'spiroWeeks', 'plsWeeks'];
  rtdbPaths.forEach(function(pathName) {
    var csPath = 'cardio_state/' + pathName + '/' + weekKey;
    var csUrl = SUPABASE_URL + '/rest/v1/cardio_state?path=eq.' + encodeURIComponent(csPath) + '&select=data';
    fetch(csUrl, { headers: _sbHeaders })
      .then(function(r) { return r.json(); })
      .then(function(rows) {
        if (rows && rows[0] && rows[0].data !== undefined && rows[0].data !== null) {
          console.log('[cardio_state] Dati da Supabase per:', pathName);
          done(pathName, rows[0].data);
        } else {
          // Fallback Firebase RTDB
          console.log('[cardio_state] Nessun dato Supabase, fallback Firebase per:', pathName);
          _getFbToken().then(function(token) {
            var url = RTDB_BASE + '/cardio_state/' + pathName + '/' + encodeURIComponent(weekKey) + '.json';
            if (token) url += '?auth=' + encodeURIComponent(token);
            fetch(url)
              .then(function(r) { return r.json(); })
              .then(function(data) {
                // Firebase restituisce {"error":"..."} in caso di token scaduto o permesso negato
                if (data && data.error) {
                  console.warn(pathName + ' Firebase auth error:', data.error);
                  done(pathName, {});
                } else {
                  done(pathName, data || {});
                }
              })
              .catch(function(e) { console.warn(pathName + ' Firebase fetch error:', e); done(pathName, {}); });
          });
        }
      })
      .catch(function(e) {
        console.warn(pathName + ' Supabase error, fallback Firebase:', e);
        _getFbToken().then(function(token) {
          var url = RTDB_BASE + '/cardio_state/' + pathName + '/' + encodeURIComponent(weekKey) + '.json';
          if (token) url += '?auth=' + encodeURIComponent(token);
          fetch(url)
            .then(function(r) { return r.json(); })
            .then(function(data) {
              if (data && data.error) {
                console.warn(pathName + ' Firebase auth error (fallback):', data.error);
                done(pathName, {});
              } else {
                done(pathName, data || {});
              }
            })
            .catch(function(e2) { console.warn(pathName + ' Firebase fetch error:', e2); done(pathName, {}); });
        });
      });
  });
}


function processAndRender(data) {
  var dayIdx = getTodayDayIdx();
  var weeks = data.weeks || {};
  var cardiologists = data.cardiologists || [];

  // === TURNO COMPLETO & SOLO ECG per sessione ===
  var tcMattina = [], ecgMattina = [];
  var tcPomeriggio = [], ecgPomeriggio = [];

  var slotKeyM = dayIdx + '_0';
  var slotKeyP = dayIdx + '_1';

  for (var docKey in weeks) {
    if (!weeks.hasOwnProperty(docKey)) continue;
    var docData = weeks[docKey];
    if (!docData || docData.ferie || !docData.slots) continue;
    var docName = docKey.replace(/\u00B7/g, '.');
    var slots = docData.slots;

    // Mattina
    var slotM = null;
    if (typeof slots === 'object' && !Array.isArray(slots)) {
      slotM = slots[slotKeyM] || null;
    }
    if (slotM === 'confermato') tcMattina.push({ name: docName, key: docKey });
    else if (slotM === 'confermato-ecg') ecgMattina.push({ name: docName, key: docKey });

    // Pomeriggio
    var slotP = null;
    if (typeof slots === 'object' && !Array.isArray(slots)) {
      slotP = slots[slotKeyP] || null;
    }
    if (slotP === 'confermato') tcPomeriggio.push({ name: docName, key: docKey });
    else if (slotP === 'confermato-ecg') ecgPomeriggio.push({ name: docName, key: docKey });
  }

  tcMattina.sort(function(a, b) { return a.name.localeCompare(b.name, 'it'); });
  ecgMattina.sort(function(a, b) { return a.name.localeCompare(b.name, 'it'); });
  tcPomeriggio.sort(function(a, b) { return a.name.localeCompare(b.name, 'it'); });
  ecgPomeriggio.sort(function(a, b) { return a.name.localeCompare(b.name, 'it'); });

  // === HOLTER TURNI ===
  var holterDocs = [];
  var holterWeeks = data.holterWeeks || {};
  for (var dk in holterWeeks) {
    if (!holterWeeks.hasOwnProperty(dk)) continue;
    var hd = holterWeeks[dk];
    if (!hd || hd.ferie) continue;
    var hSlot = getSlotData(hd.slots, dayIdx);
    var hType = holterConfType(hSlot);
    if (!hType) continue;
    holterDocs.push({ name: dk.replace(/\u00B7/g, '.'), key: dk, c16: hType === 'c16' });
  }
  holterDocs.sort(function(a, b) { return a.name.localeCompare(b.name, 'it'); });

  // === CONSUNTIVO HC ===
  var hcDocs = [];
  var hcWeeks = data.hcWeeks || {};
  for (var dk in hcWeeks) {
    if (!hcWeeks.hasOwnProperty(dk)) continue;
    var hcd = hcWeeks[dk];
    if (!hcd || hcd.ferie) continue;
    var hcSlot = getSlotData(hcd.slots, dayIdx);
    if (!hcSlot) continue;
    var hcMax = hcSlot.num || hcSlot.val || '';
    hcDocs.push({ name: dk.replace(/\u00B7/g, '.'), key: dk, max: hcMax });
  }
  hcDocs.sort(function(a, b) { return a.name.localeCompare(b.name, 'it'); });

  // === CONSUNTIVO HP ===
  var hpDocs = [];
  var hpWeeks = data.hpWeeks || {};
  for (var dk in hpWeeks) {
    if (!hpWeeks.hasOwnProperty(dk)) continue;
    var hpd = hpWeeks[dk];
    if (!hpd || hpd.ferie) continue;
    var hpSlot = getSlotData(hpd.slots, dayIdx);
    if (!hpSlot) continue;
    var hpMax = hpSlot.num || hpSlot.val || '';
    hpDocs.push({ name: dk.replace(/\u00B7/g, '.'), key: dk, max: hpMax });
  }
  hpDocs.sort(function(a, b) { return a.name.localeCompare(b.name, 'it'); });

  // === SPIROMETRIA ===
  var spiroDocs = [];
  var spiroWeeks = data.spiroWeeks || {};
  for (var dk in spiroWeeks) {
    if (!spiroWeeks.hasOwnProperty(dk)) continue;
    var spd = spiroWeeks[dk];
    if (!spd || spd.ferie) continue;
    var spSlot = getSlotData(spd.slots, dayIdx);
    if (!spSlot) continue;
    spiroDocs.push({ name: dk.replace(/\u00B7/g, '.'), key: dk });
  }
  spiroDocs.sort(function(a, b) { return a.name.localeCompare(b.name, 'it'); });

  // === POLISONNOGRAFIA ===
  var plsDocs = [];
  var plsWeeks = data.plsWeeks || {};
  for (var dk in plsWeeks) {
    if (!plsWeeks.hasOwnProperty(dk)) continue;
    var pld = plsWeeks[dk];
    if (!pld || pld.ferie) continue;
    var plSlot = getSlotData(pld.slots, dayIdx);
    if (!plSlot) continue;
    plsDocs.push({ name: dk.replace(/\u00B7/g, '.'), key: dk });
  }
  plsDocs.sort(function(a, b) { return a.name.localeCompare(b.name, 'it'); });

  // ══════════════════════════════════════════
  // RENDERING
  // ══════════════════════════════════════════

  // Turno completo & Solo ECG
  renderDocList('tc-mattina', tcMattina);
  renderDocList('tc-pomeriggio', tcPomeriggio);
  // Solo ECG con orario renderizzato direttamente nella card

  // Holter Cardiaco: turni holter prima, poi consuntivo HC con disponibilità
  var holterCLines = [];
  for (var i = 0; i < holterDocs.length; i++) {
    var htDoc = holterDocs[i];
    var htHcKey = 'd' + dayIdx + '_hc_' + htDoc.key;
    var htHpKey = 'd' + dayIdx + '_hp_' + htDoc.key;
    var htHcMin = htDoc.c16 ? 16 : 10;
    var htHcDone = !!(data.hcCountsExists || {})[htHcKey] && ((data.hcCountsMap || {})[htHcKey] || 0) >= htHcMin;
    var htHpDone = !!(data.hpCountsExists || {})[htHpKey] && ((data.hpCountsMap || {})[htHpKey] || 0) >= 10;
    var htAllDone = htDoc.c16 ? htHcDone : (htHcDone && htHpDone);
    var htColor = htAllDone ? '#4ade80' : '#f48fb1';
    var ht16Tag = htDoc.c16 ? ' <span style="font-size: 21px;font-weight:600;opacity:.75;">(16HC)</span>' : '';
    holterCLines.push('<span class="n" style="color:' + htColor + ';">' + esc(htDoc.name) + ht16Tag + '</span>');
  }
  if (holterDocs.length > 0 && hcDocs.length > 0) {
    holterCLines.push('<span class="n" style="font-size: 11px;opacity:0.4;letter-spacing:2px;column-span:all;">── CONSUNTIVO ──</span>');
  }
  for (var i = 0; i < hcDocs.length; i++) {
    var hcDoc = hcDocs[i];
    var hcCountKey = 'd' + dayIdx + '_hc_' + hcDoc.key;
    var hcMax = parseInt(hcDoc.max) || 0;
    var hcHasCount = !!(data.hcCountsExists || {})[hcCountKey];
    var hcCountVal = hcHasCount ? ((data.hcCountsMap || {})[hcCountKey] || 0) : 0;
    var t;
    if (hcHasCount && hcMax > 0 && hcCountVal >= hcMax) {
      // Completo: nome verde + disponibilità max tra parentesi
      t = '<span style="color:#4ade80;">' + esc(hcDoc.name) + ' <span style="font-size: 21px;font-weight:600;opacity:.75;">(' + esc(String(hcMax)) + ')</span></span>';
    } else if (hcHasCount && hcCountVal > 0 && hcMax > 0) {
      // Parziale: nome + (N su MAX)
      t = esc(hcDoc.name) + ' <span style="font-size: 21px;font-weight:600;opacity:.75;">(' + hcCountVal + ' su ' + esc(String(hcMax)) + ')</span>';
    } else if (hcMax > 0) {
      // Nessun conteggio: solo MAX
      t = esc(hcDoc.name) + ' <span style="font-size: 21px;font-weight:600;opacity:.75;">(' + esc(String(hcMax)) + ')</span>';
    } else {
      t = esc(hcDoc.name);
    }
    holterCLines.push('<span class="n">'+t+'</span>');
  }
  document.getElementById('esame-holterc').innerHTML = holterCLines.length
    ? holterCLines.join('')
    : '<span class="esame-empty">\u2014</span>';

  // Holter Pressorio: consuntivo HP
  var hpLines = [];
  for (var i = 0; i < hpDocs.length; i++) {
    var hpDoc = hpDocs[i];
    var hpCountKey = 'd' + dayIdx + '_hp_' + hpDoc.key;
    var hpMax = parseInt(hpDoc.max) || 0;
    var hpHasCount = !!(data.hpCountsExists || {})[hpCountKey];
    var hpCountVal = hpHasCount ? ((data.hpCountsMap || {})[hpCountKey] || 0) : 0;
    var t;
    if (hpHasCount && hpMax > 0 && hpCountVal >= hpMax) {
      // Completo: nome verde + disponibilità max tra parentesi
      t = '<span style="color:#4ade80;">' + esc(hpDoc.name) + ' <span style="font-size: 21px;font-weight:600;opacity:.75;">(' + esc(String(hpMax)) + ')</span></span>';
    } else if (hpHasCount && hpCountVal > 0 && hpMax > 0) {
      t = esc(hpDoc.name) + ' <span style="font-size: 21px;font-weight:600;opacity:.75;">(' + hpCountVal + ' su ' + esc(String(hpMax)) + ')</span>';
    } else if (hpMax > 0) {
      t = esc(hpDoc.name) + ' <span style="font-size: 21px;font-weight:600;opacity:.75;">(' + esc(String(hpMax)) + ')</span>';
    } else {
      t = esc(hpDoc.name);
    }
    hpLines.push('<span class="n">'+t+'</span>');
  }
  document.getElementById('esame-holterp').innerHTML = hpLines.length
    ? hpLines.join('')
    : '<span class="esame-empty">\u2014</span>';

  // Spirometria
  var spiroLines = [];
  for (var i = 0; i < spiroDocs.length; i++) {
    var spDoc = spiroDocs[i];
    var spKey = 'd' + dayIdx + '_sp_' + spDoc.key;
    var spCount = (data.spiroCountsExists || {})[spKey] ? ((data.spiroCountsMap || {})[spKey] || 0) : 0;
    var spLabel = esc(spDoc.name);
    if (spCount > 0) {
      spLabel += ' <span style="font-size: 21px;font-weight:600;opacity:.75;">(agg. ' + spCount + ')</span>';
    }
    spiroLines.push('<span class="n">' + spLabel + '</span>');
  }
  document.getElementById('esame-spiro').innerHTML = spiroLines.length
    ? spiroLines.join('')
    : '<span class="esame-empty">\u2014</span>';

  // Polisonnografia
  var plsLines = [];
  for (var i = 0; i < plsDocs.length; i++) {
    var plDoc = plsDocs[i];
    var plKey = 'd' + dayIdx + '_pls_' + plDoc.key;
    var plCount = (data.plsCountsExists || {})[plKey] ? ((data.plsCountsMap || {})[plKey] || 0) : 0;
    var plLabel = esc(plDoc.name);
    if (plCount > 0) {
      plLabel += ' <span style="font-size: 21px;font-weight:600;opacity:.75;">(agg. ' + plCount + ')</span>';
    }
    plsLines.push('<span class="n">' + plLabel + '</span>');
  }
  document.getElementById('esame-polison').innerHTML = plsLines.length
    ? plsLines.join('')
    : '<span class="esame-empty">\u2014</span>';

  // ECG Orari — usa ecg_orari da kv_store (Supabase) come fonte primaria,
  // con fallback a holter_counts.ecg_times + Firebase per retrocompatibilità
  var ecgOrari   = data.ecgOrari || null;
  var ecgTimes   = data.ecgTimes || {};
  var ecgOrariDay = null;
  if (ecgOrari && ecgOrari.orari) {
    ecgOrariDay = ecgOrari.orari[String(dayIdx)] || null;
  }

  function getEcgOrarioFromKv(docKey, session) {
    if (!ecgOrariDay) return null;
    var list = ecgOrariDay[session] || [];
    for (var x = 0; x < list.length; x++) {
      if (list[x].key === docKey || list[x].name === docKey) {
        return { start: list[x].orario_start || '', end: list[x].orario_end || '', tipo: list[x].tipo || '' };
      }
    }
    return null;
  }

  var ecgMattinaRows = [];
  var ecgPomeriggioRows = [];

  for (var i = 0; i < ecgMattina.length; i++) {
    var docKey = ecgMattina[i].key;
    var matched = matchCardiologo(docKey, cardiologists);
    var docData = weeks[docKey];
    var oraDa = '', oraA = '';

    // 1) Fonte primaria: ecg_orari/{weekKey} su kv_store
    var kvOra = getEcgOrarioFromKv(docKey, 'mattina');
    if (kvOra) {
      oraDa = kvOra.start;
      oraA  = kvOra.end;
    } else {
      // 2) Fallback: ecgTimes (holter_counts) + resolveOrario (Firebase)
      var ecgStartKey = 'd' + dayIdx + '_s0_ecg_start_' + docKey;
      var ecgEndKey   = 'd' + dayIdx + '_s0_ecg_end_'   + docKey;
      var userStart = ecgTimes[ecgStartKey] || '';
      var userEnd   = ecgTimes[ecgEndKey]   || '';
      var orario = resolveOrario(docData, dayIdx, 'mattina');
      if (!orario && matched && matched.orario) { orario = parseOrario(matched.orario); }
      if (orario && orario.mattina) { oraDa = orario.mattina.start; oraA = orario.mattina.end; }
      else if (orario && orario.generic) { oraDa = orario.generic.start; oraA = orario.generic.end; }
      if (userStart) oraDa = userStart;
      if (userEnd)   oraA  = userEnd;
    }

    var ecgBadge = (kvOra && kvOra.tipo) ? kvOra.tipo : '';
    if (!ecgBadge && matched) {
      if (matched.ecg100 === true) ecgBadge = 'ECG 100';
      else if (matched.ecg75 === true) ecgBadge = 'ECG 75';
    }
    if (!ecgBadge && docData) {
      if (docData.ecg100 === true) ecgBadge = 'ECG 100';
      else if (docData.ecg75 === true) ecgBadge = 'ECG 75';
    }
    ecgBadge = ecgDoppioLabel(ecgBadge, docData, dayIdx + '_0');
    ecgMattinaRows.push({ medico: ecgMattina[i].name, oraDa: oraDa, oraA: oraA, ecgBadge: ecgBadge });
  }

  for (var i = 0; i < ecgPomeriggio.length; i++) {
    var docKey = ecgPomeriggio[i].key;
    var matched = matchCardiologo(docKey, cardiologists);
    var docData = weeks[docKey];
    var oraDaP = '', oraAP = '';

    // 1) Fonte primaria: ecg_orari/{weekKey} su kv_store
    var kvOraP = getEcgOrarioFromKv(docKey, 'pomeriggio');
    if (kvOraP) {
      oraDaP = kvOraP.start;
      oraAP  = kvOraP.end;
    } else {
      // 2) Fallback: ecgTimes (holter_counts) + resolveOrario (Firebase)
      var ecgStartKeyP = 'd' + dayIdx + '_s1_ecg_start_' + docKey;
      var ecgEndKeyP   = 'd' + dayIdx + '_s1_ecg_end_'   + docKey;
      var userStartP = ecgTimes[ecgStartKeyP] || '';
      var userEndP   = ecgTimes[ecgEndKeyP]   || '';
      var orario = resolveOrario(docData, dayIdx, 'pomeriggio');
      if (!orario && matched && matched.orario) { orario = parseOrario(matched.orario); }
      if (orario && orario.pomeriggio) { oraDaP = orario.pomeriggio.start; oraAP = orario.pomeriggio.end; }
      else if (orario && orario.generic) { oraDaP = orario.generic.start; oraAP = orario.generic.end; }
      if (userStartP) oraDaP = userStartP;
      if (userEndP)   oraAP  = userEndP;
    }

    var ecgBadge = (kvOraP && kvOraP.tipo) ? kvOraP.tipo : '';
    if (!ecgBadge && matched) {
      if (matched.ecg100 === true) ecgBadge = 'ECG 100';
      else if (matched.ecg75 === true) ecgBadge = 'ECG 75';
    }
    if (!ecgBadge && docData) {
      if (docData.ecg100 === true) ecgBadge = 'ECG 100';
      else if (docData.ecg75 === true) ecgBadge = 'ECG 75';
    }
    ecgBadge = ecgDoppioLabel(ecgBadge, docData, dayIdx + '_1');
    ecgPomeriggioRows.push({ medico: ecgPomeriggio[i].name, oraDa: oraDaP, oraA: oraAP, ecgBadge: ecgBadge });
  }
  // Ordina per ora di inizio (senza orario in fondo), a parità ordine alfabetico
  function sortEcgRows(rows) {
    rows.sort(function(a, b) {
      var ta = timeToMin(a.oraDa), tb = timeToMin(b.oraDa);
      if (ta < 0) ta = 99999;
      if (tb < 0) tb = 99999;
      if (ta !== tb) return ta - tb;
      return String(a.medico || '').localeCompare(String(b.medico || ''), 'it');
    });
    return rows;
  }
  renderEcgInCard('wrap-ecg-mattina', sortEcgRows(ecgMattinaRows));
  renderEcgInCard('wrap-ecg-pomeriggio', sortEcgRows(ecgPomeriggioRows));
  updateEcgDots();
}

/* ── ECG BADGE CLASS ── */
/* Doppio turno ECG: flag weeks/<medico>/doppio/"<giorno>_<sessione>" === true  ->  100 -> 200, 75 -> 150 */
function ecgDoppioLabel(label, docData, slotKey) {
  if (!label) return label;
  var dop = docData && docData.doppio && docData.doppio[slotKey] === true;
  if (!dop) return label;
  return String(label).replace(/\d+/, function(n) { return String(parseInt(n, 10) * 2); });
}

function ecgBadgeClass(label) {
  var n = String(label || '').replace(/\D/g, '');
  if (n === '100') return ' ecg-100';
  if (n === '75')  return ' ecg-75';
  if (n === '200') return ' ecg-200';
  if (n === '150') return ' ecg-150';
  return '';
}

/* ── ECG STATUS DOTS UPDATE ── */
function timeToMin(t) {
  if (!t) return -1;
  var parts = t.split(':');
  if (parts.length < 2) return -1;
  var h = parseInt(parts[0], 10);
  var m = parseInt(parts[1], 10);
  if (isNaN(h) || isNaN(m)) return -1;
  return h * 60 + m;
}

function updateEcgDots() {
  var now = new Date();
  var nowMin = now.getHours() * 60 + now.getMinutes();
  var dots = document.querySelectorAll('.ecg-status-dot');
  for (var i = 0; i < dots.length; i++) {
    var dot = dots[i];
    var start = timeToMin(dot.getAttribute('data-start'));
    var end   = timeToMin(dot.getAttribute('data-end'));
    if (start < 0 || end < 0) {
      dot.className = 'ecg-status-dot gray';
    } else if (nowMin >= start && nowMin < end) {
      dot.className = 'ecg-status-dot green';
    } else if (nowMin >= (start - 15) && nowMin < start) {
      dot.className = 'ecg-status-dot yellow';
    } else {
      dot.className = 'ecg-status-dot red';
    }
  }
}

function renderDocList(elId, docs) {
  var el = document.getElementById(elId);
  if (!docs || !docs.length) {
    el.innerHTML = '<span class="doc-empty">\u2014</span>';
    return;
  }
  el.innerHTML = docs.map(function(d) { return esc(d.name); }).join('<br>');
}

function renderEcgInCard(wrapId, rows) {
  var wrap = document.getElementById(wrapId);
  if (!rows || !rows.length) {
    wrap.innerHTML = '<span class="doc-empty">\u2014</span>';
    return;
  }
  wrap.style.alignItems = 'stretch';
  wrap.style.padding = '0';
  wrap.style.gap = '0';
  var html = '';
  rows.forEach(function(r) {
    var ora = (r.oraDa && r.oraA)
      ? esc(padTime(r.oraDa)) + ' \u2013 ' + esc(padTime(r.oraA))
      : esc(padTime(r.oraDa) || '');
    html += '<div class="ecg-row">';
    html += '<span class="ecg-status-dot gray" data-start="' + esc(r.oraDa || '') + '" data-end="' + esc(r.oraA || '') + '"></span>';
    html += '<div class="ecg-doc-wrap">';
    html += '<span class="ecg-doctor">' + esc(r.medico || '') + '</span>';
    if (r.ecgBadge) html += '<span class="ecg-badge-chip' + ecgBadgeClass(r.ecgBadge) + '">' + esc(r.ecgBadge) + '</span>';
    html += '</div>';
    if (ora) html += '<span class="ecg-time">' + ora + '</span>';
    html += '</div>';
  });
  wrap.innerHTML = html;
}

function renderEcg(rows) {
  var wrap = document.getElementById('ecg-cols');
  if (!rows || !rows.length) {
    wrap.innerHTML = '<div class="ecg-empty" style="grid-column:1/-1;">Nessun cardiologo solo ECG</div>';
    return;
  }
  var mattina    = rows.filter(function(r) { return r.turno === 'mattina'; });
  var pomeriggio = rows.filter(function(r) { return r.turno === 'pomeriggio'; });

  var MAX_PER_COL = 4;

  // Suddivide un array in chunk di max N elementi
  function chunkArr(arr, n) {
    var out = [];
    if (!arr.length) { out.push([]); return out; }
    for (var i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n));
    return out;
  }

  // Genera HTML per una sotto-colonna
  function subColHtml(list, cls, label, showLabel) {
    var h = '<div>';
    h += '<div class="ecg-col-label ' + cls + '"' +
         (showLabel ? '' : ' style="visibility:hidden;"') + '>' + label + '</div>';
    if (!list.length) {
      h += '<div class="ecg-empty">\u2014</div>';
    } else {
      list.forEach(function(r) {
        var ora = (r.oraDa && r.oraA) ? esc(padTime(r.oraDa)) + ' \u2013 ' + esc(padTime(r.oraA)) : esc(padTime(r.oraDa) || '');
        h += '<div class="ecg-row">';
        h += '<span class="ecg-status-dot gray" data-start="' + esc(r.oraDa || '') + '" data-end="' + esc(r.oraA || '') + '"></span>';
        h += '<div class="ecg-doc-wrap">';
        h += '<span class="ecg-doctor">' + esc(r.medico || '') + '</span>';
        if (r.ecgBadge) h += '<span class="ecg-badge-chip' + ecgBadgeClass(r.ecgBadge) + '">' + esc(r.ecgBadge) + '</span>';
        h += '</div>';
        h += '<span class="ecg-time">' + ora + '</span>';
        h += '</div>';
      });
    }
    h += '</div>';
    return h;
  }

  var mattinaChunks    = chunkArr(mattina,    MAX_PER_COL);
  var pomeriggioChunks = chunkArr(pomeriggio, MAX_PER_COL);

  // Calcola il grid template dinamico:
  // [M-col…] [thin-div] [M-col…] … [MAIN-DIV 2px] [P-col…] [thin-div] [P-col…] …
  var tpl = [];
  for (var i = 0; i < mattinaChunks.length; i++) {
    if (i > 0) tpl.push('1px');
    tpl.push('1fr');
  }
  tpl.push('2px'); // divisore centrale Mattina / Pomeriggio
  for (var j = 0; j < pomeriggioChunks.length; j++) {
    if (j > 0) tpl.push('1px');
    tpl.push('1fr');
  }
  wrap.style.gridTemplateColumns = tpl.join(' ');

  var html = '';
  // Colonne Mattina
  for (var i = 0; i < mattinaChunks.length; i++) {
    if (i > 0) html += '<div class="ecg-col-divider"></div>';
    html += subColHtml(mattinaChunks[i], 'm', 'Mattina', i === 0);
  }
  // Divisore centrale
  html += '<div class="ecg-col-divider" style="background:rgba(99,102,241,.45);"></div>';
  // Colonne Pomeriggio
  for (var j = 0; j < pomeriggioChunks.length; j++) {
    if (j > 0) html += '<div class="ecg-col-divider"></div>';
    html += subColHtml(pomeriggioChunks[j], 'p', 'Pomeriggio', j === 0);
  }

  wrap.innerHTML = html;
}

/* ── RELOAD ── */
function reloadTurni() {
  if (reloading) return;
  reloading = true;
  setRefreshIcon(true);
  startLoaderBar();

  fetchAllData(function(data) {
    // Sicurezza: se i nuovi dati sono vuoti ma quelli vecchi erano validi, mantieni i vecchi
    // Questo evita che errori temporanei (es. token Firebase scaduto) cancellino i medici
    if (window._lastCalData) {
      ['weeks','holterWeeks','hcWeeks','hpWeeks','spiroWeeks','plsWeeks'].forEach(function(k) {
        var newVal = data[k];
        var oldVal = window._lastCalData[k];
        var newEmpty = !newVal || typeof newVal !== 'object' || Object.keys(newVal).length === 0;
        var oldValid = oldVal && typeof oldVal === 'object' && Object.keys(oldVal).length > 0;
        if (newEmpty && oldValid) {
          console.warn('[reloadTurni] Dati vuoti per', k, '— mantengo dati precedenti');
          data[k] = oldVal;
        }
      });
    }
    window._lastCalData = data;
    processAndRender(data);
    reloading = false;
    stopLoaderBar();
    setRefreshIcon(false);
    lastUpdated = new Date();
    updateRefreshStatus();
  });
}

/* ── AVVIO ── */
(function init() {
  // Primo render: fetch dati da Firebase
  setRefreshIcon(true);
  startLoaderBar();
  fetchAllData(function(data) {
    window._lastCalData = data;
    processAndRender(data);
    stopLoaderBar();
    setRefreshIcon(false);
    lastUpdated = new Date();
    updateRefreshStatus();

    /* ── Supabase Realtime: aggiorna ECG istantaneamente ──────────────────
       Ascolta INSERT/UPDATE su holter_counts (dove index.html salva gli
       orari ECG manuali in ecg_times) e su kv_store (aggregato).
       Al cambio ri-renderizza la tabella ECG senza attendere il refresh.  */
    (function setupEcgRealtime() {
      if (!_supabaseClient) {
        console.warn('[ECG Realtime] Supabase JS non disponibile, skip realtime.');
        return;
      }
      var _weekKey = getMondayOfWeek(new Date());

      /* ── 1. holter_counts → fonte primaria degli orari manuali ── */
      _supabaseClient
        .channel('ecg-holter-' + _weekKey)
        .on(
          'postgres_changes',
          {
            event: '*',
            schema: 'public',
            table: 'holter_counts',
            filter: 'week_key=eq.' + _weekKey
          },
          function(payload) {
            console.log('[ECG Realtime] holter_counts aggiornato:', payload.eventType);
            if (!window._lastCalData) return;
            /* Aggiorna ecgTimesRaw con i nuovi orari manuali */
            var newRow = payload.new || {};
            if (newRow.ecg_times !== undefined) {
              window._lastCalData.ecgTimesRaw = newRow.ecg_times || {};
            }
            /* Ri-fetch kv_store in parallelo per aggiornare anche ecgOrari */
            var kvUrl = SUPABASE_URL + '/rest/v1/kv_store?id=eq.' + encodeURIComponent('ecg_orari/' + _weekKey) + '&select=data';
            fetch(kvUrl, { headers: _sbHeaders })
              .then(function(r) { return r.json(); })
              .then(function(arr) {
                if (arr && arr[0] && arr[0].data) {
                  window._lastCalData.ecgOrari = arr[0].data;
                }
                processAndRender(window._lastCalData);
                console.log('[ECG Realtime] ECG aggiornato da holter_counts.');
              })
              .catch(function() {
                /* kv_store non ancora aggiornato, usa solo ecgTimesRaw */
                window._lastCalData.ecgOrari = null;
                processAndRender(window._lastCalData);
                console.log('[ECG Realtime] ECG aggiornato (solo ecgTimesRaw).');
              });
          }
        )
        .subscribe(function(status) {
          console.log('[ECG Realtime] holter_counts canale →', status);
        });

      /* ── 2. cardio_state → aggiornamenti scheduling (weeks, hcWeeks, ecc.) ── */
      var _csPaths = ['weeks', 'holterWeeks', 'hcWeeks', 'hpWeeks', 'spiroWeeks', 'plsWeeks'];
      _csPaths.forEach(function(pathName) {
        var csPath = 'cardio_state/' + pathName + '/' + _weekKey;
        _supabaseClient
          .channel('cs-' + pathName + '-' + _weekKey)
          .on(
            'postgres_changes',
            {
              event: '*',
              schema: 'public',
              table: 'cardio_state',
              filter: 'path=eq.' + csPath
            },
            function(payload) {
              console.log('[Realtime] cardio_state aggiornato:', pathName, payload.eventType);
              if (!window._lastCalData) return;
              if (payload.new && payload.new.data !== undefined) {
                var newData = payload.new.data;
                // Non sovrascrivere dati validi con un oggetto vuoto/null
                var newEmpty = !newData || typeof newData !== 'object' || Object.keys(newData).length === 0;
                var oldValid = window._lastCalData[pathName] &&
                               typeof window._lastCalData[pathName] === 'object' &&
                               Object.keys(window._lastCalData[pathName]).length > 0;
                if (newEmpty && oldValid) {
                  console.warn('[Realtime] Dati vuoti per', pathName, '— aggiornamento ignorato');
                  return;
                }
                window._lastCalData[pathName] = newData;
                processAndRender(window._lastCalData);
              }
            }
          )
          .subscribe(function(status) {
            console.log('[Realtime] cardio_state canale ' + pathName + ' →', status);
          });
      });

      /* ── 3. kv_store → copertura per aggiornamenti aggregati (ecg_orari, turni, cardiologists) ── */
      _supabaseClient
        .channel('ecg-orari-' + _weekKey)
        .on(
          'postgres_changes',
          {
            event: '*',
            schema: 'public',
            table: 'kv_store',
            filter: 'id=eq.ecg_orari/' + _weekKey
          },
          function(payload) {
            console.log('[Realtime] ecg_orari aggiornato:', payload.eventType);
            if (!window._lastCalData) return;
            var newData = payload.new && payload.new.data ? payload.new.data : null;
            if (newData) {
              window._lastCalData.ecgOrari = newData;
              processAndRender(window._lastCalData);
            }
          }
        )
        .subscribe(function(status) {
          console.log('[Realtime] ecg_orari canale →', status);
        });

      /* ── 4. kv_store → turni_medici/turni (aggiornamenti turni da Situazione-medici) ── */
      _supabaseClient
        .channel('turni-live')
        .on(
          'postgres_changes',
          {
            event: '*',
            schema: 'public',
            table: 'kv_store',
            filter: 'id=eq.turni_medici/turni'
          },
          function(payload) {
            console.log('[Realtime] turni aggiornati:', payload.eventType);
            if (!window._lastCalData) return;
            var newData = payload.new && payload.new.data ? payload.new.data : null;
            if (newData) {
              window._lastCalData.turni = newData.lista || [];
              processAndRender(window._lastCalData);
            }
          }
        )
        .subscribe(function(status) {
          console.log('[Realtime] turni canale →', status);
        });

      /* ── 5. kv_store → turni_medici/cardiologists ── */
      _supabaseClient
        .channel('cardiologists-live')
        .on(
          'postgres_changes',
          {
            event: '*',
            schema: 'public',
            table: 'kv_store',
            filter: 'id=eq.turni_medici/cardiologists'
          },
          function(payload) {
            console.log('[Realtime] cardiologists aggiornati:', payload.eventType);
            if (!window._lastCalData) return;
            var newData = payload.new && payload.new.data ? payload.new.data : null;
            if (newData) {
              window._lastCalData.cardiologists = newData.lista || [];
              processAndRender(window._lastCalData);
            }
          }
        )
        .subscribe(function(status) {
          console.log('[Realtime] cardiologists canale →', status);
        });
    })();
  });

  function scheduleRefresh() {
    nextRefresh = Date.now() + REFRESH_INTERVAL_MS;
    setTimeout(function() {
      reloadTurni();
      scheduleRefresh();
    }, REFRESH_INTERVAL_MS);
  }
  scheduleRefresh();

  setInterval(updateClock, 1000);
  updateClock();
  setInterval(updateEcgDots, 60000);

  // Anti-freeze TV: tocca il DOM ogni 15s
  setInterval(function() {
    var bar = document.getElementById('rainbow-bar');
    bar.style.opacity = '0.99';
    setTimeout(function() { bar.style.opacity = '1'; }, 100);
  }, 15000);

  // Watchdog logo
  var logoSrc = document.getElementById('footer-logo-img').src;
  setInterval(function() {
    var img = document.getElementById('footer-logo-img');
    if (!img.src || img.src.length < 100 || img.naturalWidth === 0) {
      img.src = logoSrc;
    }
  }, 5000);
})();


/* ── AUTO-RIDIMENSIONAMENTO ESAMI: se ci sono tanti medici, riduce il carattere finché entrano tutti ── */
function fitEsami() {
  ['esame-holterc','esame-holterp','esame-spiro','esame-polison'].forEach(function(id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.style.fontSize = '';
    var size = parseFloat(getComputedStyle(el).fontSize) || 38;
    var guard = 120;
    while (guard-- > 0 && size > 9 &&
           (el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1)) {
      size -= 1;
      el.style.fontSize = size + 'px';
    }
  });
}
(function() {
  var _orig = processAndRender;
  processAndRender = function(d) { _orig(d); fitEsami(); fitTurni(); };
  window.addEventListener('resize', function() { fitEsami(); fitTurni(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function() { fitEsami(); fitTurni(); });
  setInterval(function() { fitEsami(); fitTurni(); }, 5000);
})();

/* ── AUTO-RIDIMENSIONAMENTO TURNI: ogni scheda (turno completo / ECG) si riduce da sola ── */
function fitTurni() {
  Array.prototype.forEach.call(document.querySelectorAll('.col > .card'), function(card) {
    var w = card.querySelector('.doc-section');
    if (!w) return;
    var k = 1, guard = 120;
    w.style.fontSize = '';
    while (guard-- > 0 && k > 0.3 && card.scrollHeight > card.clientHeight + 1) {
      k = Math.round((k - 0.02) * 100) / 100;
      w.style.fontSize = (k * 16) + 'px';
    }
  });
}
