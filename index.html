
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pianificazione Medici</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230a162d'/><path d='M50 75 C50 75 20 55 20 35 C20 25 28 18 38 20 C43 21 47 25 50 30 C53 25 57 21 62 20 C72 18 80 25 80 35 C80 55 50 75 50 75Z' fill='%233b82f6'/><polyline points='28,50 36,38 44,56 52,32 60,50 68,44 76,50' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: #040912;
  font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
  overflow: hidden;
  color: #f0f4ff;
}

/* ── BARRA TOP ANIMATA ── */
#rainbow-bar {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 4px;
  z-index: 10000;
  background: linear-gradient(90deg,
    #3b82f6, #6366f1, #8b5cf6, #3b82f6, #06b6d4, #3b82f6);
  background-size: 400% 100%;
  -webkit-animation: slideBar 6s linear infinite;
  animation: slideBar 6s linear infinite;
}
@-webkit-keyframes slideBar {
  0%   { background-position: 0% 0%; }
  100% { background-position: 400% 0%; }
}
@keyframes slideBar {
  0%   { background-position: 0% 0%; }
  100% { background-position: 400% 0%; }
}

/* ── HEADER ── */
#header {
  position: fixed;
  top: 4px; left: 0;
  width: 100%; height: 80px;
  z-index: 9998;
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  -webkit-justify-content: center;
  justify-content: center;
  background: linear-gradient(180deg, rgba(10,22,45,0.98) 0%, rgba(7,15,28,0.92) 100%);
  border-bottom: 1px solid rgba(59,130,246,0.3);
}

#data-completa {
  font-size: 50px;
  font-weight: 700;
  font-style: italic;
  color: #f0f6ff;
  letter-spacing: 2px;
  text-shadow: 0 0 24px rgba(59,130,246,0.6);
}

/* ── REFRESH LOADER BAR ── */
#loader-bar {
  position: fixed;
  top: 68px; left: 0;
  height: 3px;
  width: 0%;
  background: linear-gradient(90deg, #3b82f6, #8b5cf6);
  z-index: 9997;
  opacity: 0;
  -webkit-transition: opacity 0.3s;
  transition: opacity 0.3s;
  border-radius: 0 2px 2px 0;
}
#loader-bar.running {
  opacity: 1;
  -webkit-animation: loadAnim 3s linear forwards;
  animation: loadAnim 3s linear forwards;
}
@-webkit-keyframes loadAnim {
  0%   { width: 0%; }
  80%  { width: 90%; }
  100% { width: 90%; }
}
@keyframes loadAnim {
  0%   { width: 0%; }
  80%  { width: 90%; }
  100% { width: 90%; }
}

/* ── VIEWER AREA ── */
#viewer-wrap {
  position: fixed;
  top: 88px;
  left: 0;
  bottom: 100px;
  right: 0;
  overflow-y: auto;
  overflow-x: hidden;
  z-index: 1;
  background: #040912;
  background-image:
    radial-gradient(ellipse 80% 50% at 20% -10%, rgba(0,200,83,0.15) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 85% 110%, rgba(255,109,0,0.13) 0%, transparent 55%);
}

#turni-container {
  padding: 12px 20px 14px;
  min-height: 100%;
}

/* ── FOOTER ── */
#footer {
  position: fixed;
  bottom: 0; left: 0;
  width: 100%; height: 100px;
  z-index: 9998;
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  -webkit-align-items: center;
  align-items: center;
  padding: 0 48px;
  background: linear-gradient(0deg, rgba(10,22,45,0.98) 0%, rgba(7,15,28,0.92) 100%);
  border-top: 1px solid rgba(59,130,246,0.25);
}

/* Orologio */
#clock {
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  gap: 4px;
}

.clock-block {
  display: -webkit-flex;
  display: flex;
  gap: 2px;
}

.digit {
  width: 58px; height: 78px;
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  -webkit-justify-content: center;
  justify-content: center;
  font-size: 88px;
  font-weight: 800;
  color: #f1f5f9;
  text-shadow: 0 0 18px rgba(59,130,246,0.6);
  line-height: 1;
  -webkit-font-smoothing: antialiased;
}

.sep {
  font-size: 82px;
  font-weight: 800;
  color: #3b82f6;
  text-shadow: 0 0 18px rgba(59,130,246,0.8);
  padding: 0 4px;
  line-height: 1;
  -webkit-animation: blink 1s step-end infinite;
  animation: blink 1s step-end infinite;
}
@-webkit-keyframes blink {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.25; }
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.25; }
}

.digit-sec {
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: flex-end;
  align-items: flex-end;
  padding-bottom: 10px;
  gap: 1px;
}

.digit-sec .d {
  font-size: 42px;
  font-weight: 700;
  color: #64748b;
  width: 24px;
  text-align: center;
}

/* Centro footer */
#footer-center {
  position: absolute;
  left: 50%;
  -webkit-transform: translateX(-50%);
  transform: translateX(-50%);
  text-align: center;
  display: -webkit-flex;
  display: flex;
  -webkit-flex-direction: column;
  flex-direction: column;
  -webkit-align-items: center;
  align-items: center;
  -webkit-justify-content: center;
  justify-content: center;
}

#footer-logo-img {
  height: 62px;
  width: auto;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}

#refresh-status {
  margin-top: 6px;
  font-size: 19px;
  color: #475569;
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  -webkit-justify-content: center;
  justify-content: center;
  gap: 6px;
}

#refresh-icon {
  display: inline-block;
  font-size: 21px;
  color: #22c55e;
}
#refresh-icon.spinning {
  -webkit-animation: spin 1s linear infinite;
  animation: spin 1s linear infinite;
}
@-webkit-keyframes spin {
  0%   { -webkit-transform: rotate(0deg);   }
  100% { -webkit-transform: rotate(360deg); }
}
@keyframes spin {
  0%   { transform: rotate(0deg);   }
  100% { transform: rotate(360deg); }
}



/* ═══════════════════════════════════════
   TURNI MEDICI — CSS
   ═══════════════════════════════════════ */

:root {
  --green:      #00c853;
  --green-dark: #00962f;
  --orange:     #ff6d00;
  --orange-dark:#c43e00;
  --pink:       #e91e63;
  --amber:      #ff8f00;
  --blue:       #1565c0;
  --purple:     #6a1b9a;
  --surface:    rgba(255,255,255,0.08);
  --border:     rgba(255,255,255,0.18);
  --text:       #ffffff;
  --muted:      rgba(255,255,255,0.55);
  --radius:     18px;
}

/* ── TURNI HEADER ── */
.turni-header {
  text-align: center;
  margin-bottom: 28px;
  animation: fadeDown .5s ease both;
}
.turni-header h1 {
  font-size: clamp(32px, 3vw, 42px);
  font-weight: 800;
  letter-spacing: 3px;
  text-transform: uppercase;
  background: linear-gradient(135deg, #fff 30%, rgba(255,255,255,.5));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 10px;
}
.turni-header .date-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.07);
  border: 1px solid var(--border);
  border-radius: 50px;
  padding: 6px 18px;
  font-size: 21px;
  font-weight: 500;
  color: rgba(255,255,255,0.75);
  letter-spacing: .5px;
  backdrop-filter: blur(8px);
}
.date-badge .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
  animation: pulse 2s ease infinite;
}

/* ── MAIN GRID ── */
.main-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1.6fr;
  gap: 12px;
  margin-bottom: 12px;
}

/* ── CARD ── */
.card {
  background: var(--surface);
  border: 1.5px solid rgba(255,255,255,0.20);
  border-radius: var(--radius);
  backdrop-filter: blur(16px);
  overflow: hidden;
  animation: fadeUp .5s ease both;
  box-shadow: 0 4px 32px rgba(0,0,0,0.5);
}
.card:nth-child(2) { animation-delay: .07s; }
.card:nth-child(3) { animation-delay: .14s; }

/* ── CARD HEADER ── */
.card-hdr {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px 18px;
  font-size: 35px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
}
.card-hdr.green {
  background: linear-gradient(135deg, rgba(0,200,83,.35), rgba(0,150,47,.22));
  border-bottom: 2px solid rgba(0,200,83,.55);
  color: #a7ffcc;
  text-shadow: 0 0 18px rgba(0,230,118,0.5);
}
.card-hdr.orange {
  background: linear-gradient(135deg, rgba(255,109,0,.35), rgba(196,62,0,.22));
  border-bottom: 2px solid rgba(255,109,0,.55);
  color: #ffd0a8;
  text-shadow: 0 0 18px rgba(255,130,0,0.5);
}
.card-hdr.blue {
  background: linear-gradient(135deg, rgba(21,101,192,.35), rgba(13,71,161,.22));
  border-bottom: 2px solid rgba(59,130,246,.55);
  color: #a8c8ff;
  font-size: 24px;
  text-shadow: 0 0 18px rgba(59,130,246,0.5);
}

/* ── SECTION DIVIDER ── */
.section-label {
  font-size: 29px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.60);
  padding: 8px 18px 5px;
  border-top: 1px solid rgba(255,255,255,0.20);
}
.section-label:first-of-type { border-top: none; }

/* ── ECG CHIP ── */
.ecg-label {
  display: inline-block;
  font-size: 25px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  background: rgba(105,240,174,.20);
  color: #a7ffcc;
  border: 1px solid rgba(105,240,174,.50);
  text-shadow: 0 0 12px rgba(0,230,118,0.4);
  border-radius: 20px;
  padding: 3px 12px;
}


/* ── TURNO COMPLETO CHIP ── */
.tc-label {
  display: inline-block;
  font-size: 25px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  background: rgba(59,130,246,.20);
  color: #93c5fd;
  border: 1px solid rgba(59,130,246,.50);
  text-shadow: 0 0 12px rgba(59,130,246,0.4);
  border-radius: 20px;
  padding: 3px 12px;
}

/* ── ECG BADGE IN TABELLA ── */
.ecg-badge-chip {
  display: inline-block;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  background: rgba(59,130,246,.15);
  color: #82b1ff;
  border: 1px solid rgba(59,130,246,.3);
  border-radius: 14px;
  padding: 2px 9px;
  margin-left: 8px;
  vertical-align: middle;
  flex-shrink: 0;
}

/* ── DOCTOR SLOT ── */
.doc-section {
  padding: 10px 16px 12px;
  min-height: 80px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.doc-name {
  font-size: 42px;
  font-weight: 800;
  letter-spacing: .8px;
  text-transform: uppercase;
  text-align: center;
  line-height: 1.65;
  text-shadow: 0 0 20px rgba(255,255,255,0.35);
}
.doc-empty {
  font-size: 19px;
  color: var(--muted);
  font-style: italic;
}

/* ── ESAMI COLUMN ── */
.esami-grid {
  display: flex;
  flex-direction: column;
}
.esame-block {
  flex: 0 0 auto;
}
.esame-block + .esame-block {
  border-top: 1px solid var(--border);
}
.esame-hdr {
  padding: 10px 16px;
  font-size: 32px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.esame-hdr.pink    { background: rgba(233,30,99,.22);  color: #ffa8c8; border-bottom: 2px solid rgba(233,30,99,.45); text-shadow: 0 0 14px rgba(233,30,99,0.5); }
.esame-hdr.amber   { background: rgba(255,143,0,.20);  color: #ffe0a0; border-bottom: 2px solid rgba(255,143,0,.45); text-shadow: 0 0 14px rgba(255,143,0,0.5); }
.esame-hdr.sky     { background: rgba(21,101,192,.22); color: #b0d8ff; border-bottom: 2px solid rgba(21,101,192,.45); text-shadow: 0 0 14px rgba(59,130,246,0.5); }
.esame-hdr.violet  { background: rgba(106,27,154,.28); color: #e0b0f0; border-bottom: 2px solid rgba(106,27,154,.5); text-shadow: 0 0 14px rgba(150,50,220,0.5); }

.esame-body {
  padding: 8px 12px 8px;
  font-size: 35px;
  font-weight: 800;
  letter-spacing: .5px;
  text-transform: uppercase;
  line-height: 1.55;
  text-shadow: 0 0 14px rgba(255,255,255,0.2);
  /* nomi a cascata su 2 colonne */
  -webkit-columns: 3;
  columns: 3;
  -webkit-column-gap: 10px;
  column-gap: 10px;
}
.esame-body .n {
  display: block;
  padding: 1px 0;
  -webkit-column-break-inside: avoid;
  break-inside: avoid;
}
.esame-empty { color: var(--muted); font-style: italic; font-weight: 400; font-size: 19px; }

/* ── ECG STATUS DOT ── */
.ecg-status-dot {
  width: 13px; height: 13px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-right: 10px;
  transition: background .6s, box-shadow .6s;
}
.ecg-status-dot.green {
  background: #00e676;
  box-shadow: 0 0 7px 2px rgba(0,230,118,0.7);
}
.ecg-status-dot.yellow {
  background: #ffb300;
  box-shadow: 0 0 7px 2px rgba(255,179,0,0.7);
  animation: pulse 1.4s ease infinite;
}
.ecg-status-dot.red {
  background: #f44336;
  box-shadow: 0 0 7px 2px rgba(244,67,54,0.55);
}
.ecg-status-dot.gray {
  background: #475569;
  box-shadow: none;
}

/* ── ECG SECTION ── */
.ecg-section {
  animation: fadeUp .5s .21s ease both;
}
.ecg-table-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 var(--radius) var(--radius);
  backdrop-filter: blur(16px);
  overflow: hidden;
}
.ecg-cols {
  display: grid;
  grid-template-columns: 1fr 2px 1fr; /* default 2 col, override JS */
}
.ecg-col-divider {
  background: rgba(255,255,255,0.20);
}
.ecg-col-label {
  font-size: 29px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 10px 16px 6px;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
}
.ecg-col-label.m { color: #a7ffcc; text-shadow: 0 0 12px rgba(0,230,118,0.5); }
.ecg-col-label.p { color: #ffd0a8; text-shadow: 0 0 12px rgba(255,130,0,0.5); }
.ecg-row {
  display: flex;
  align-items: center;
  padding: 9px 16px;
  border-bottom: 1px solid var(--border);
  transition: background .15s;
  gap: 0;
}
.ecg-row .ecg-doctor {
  /* flex gestito da ecg-doc-wrap */
}
.ecg-row:last-child { border-bottom: none; }
.ecg-row:hover { background: rgba(255,255,255,0.04); }
.ecg-row .ecg-doctor {
  font-size: 35px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .5px;
  text-shadow: 0 0 16px rgba(255,255,255,0.3);
}
.ecg-row .ecg-time {
  font-size: 34px;
  font-weight: 600;
  color: rgba(255,255,255,.80);
  font-variant-numeric: tabular-nums;
  padding: 0 14px;
}
.ecg-row .ecg-max {
  font-size: 30px;
  font-weight: 700;
  background: rgba(255,255,255,.14);
  border-radius: 6px;
  padding: 3px 10px;
  color: rgba(255,255,255,.88);
}
.ecg-doc-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.ecg-badge-chip {
  display: inline-flex;
  align-items: center;
  background: rgba(255,80,80,.18);
  color: #ff8080;
  border: 1px solid rgba(255,80,80,.35);
  border-radius: 5px;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: .4px;
  padding: 2px 7px;
  white-space: nowrap;
  flex-shrink: 0;
}
.ecg-empty {
  padding: 18px;
  text-align: center;
  color: var(--muted);
  font-style: italic;
  font-size: 20px;
}

/* ── ANIMATIONS ── */
@keyframes fadeDown {
  from { opacity:0; transform: translateY(-16px); }
  to   { opacity:1; transform: translateY(0); }
}
@keyframes fadeUp {
  from { opacity:0; transform: translateY(20px); }
  to   { opacity:1; transform: translateY(0); }
}
@keyframes pulse {
  0%, 100% { opacity:1; }
  50%       { opacity:.35; }
}

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
</head>
<body>

<div id="rainbow-bar"></div>

<!-- HEADER: data centrata -->
<div id="header">
  <div id="data-completa">—</div>
</div>

<!-- LOADER BAR -->
<div id="loader-bar"></div>

<!-- VIEWER AREA: contenuto turni medici -->
<div id="viewer-wrap">
  <div id="turni-container">

    <!-- ── MAIN GRID ── -->
    <div class="main-grid">

      <!-- Mattina -->
      <div class="card">
        <div class="card-hdr green">Mattina</div>
        <div class="section-label"><span class="tc-label">Turno completo</span></div>
        <div class="doc-section" id="wrap-tc-mattina">
          <div class="doc-name" id="tc-mattina"></div>
        </div>
        <div class="section-label">
          <span class="ecg-label">Solo ECG</span>
        </div>
        <div class="doc-section" id="wrap-ecg-mattina">
        </div>
      </div>

      <!-- Pomeriggio -->
      <div class="card">
        <div class="card-hdr orange">Pomeriggio</div>
        <div class="section-label"><span class="tc-label">Turno completo</span></div>
        <div class="doc-section" id="wrap-tc-pomeriggio">
          <div class="doc-name" id="tc-pomeriggio"></div>
        </div>
        <div class="section-label">
          <span class="ecg-label">Solo ECG</span>
        </div>
        <div class="doc-section" id="wrap-ecg-pomeriggio">
        </div>
      </div>

      <!-- Esami strumentali -->
      <div class="card esami-grid">
        <div class="esame-block">
          <div class="esame-hdr pink">Holter Cardiaco</div>
          <div class="esame-body" id="esame-holterc"></div>
        </div>
        <div class="esame-block">
          <div class="esame-hdr amber">Holter Pressorio</div>
          <div class="esame-body" id="esame-holterp"></div>
        </div>
        <div class="esame-block">
          <div class="esame-hdr sky">Spirometria</div>
          <div class="esame-body" id="esame-spiro"></div>
        </div>
        <div class="esame-block">
          <div class="esame-hdr violet">Polisonnografia</div>
          <div class="esame-body" id="esame-polison"></div>
        </div>
      </div>

    </div><!-- /main-grid -->



  </div><!-- /turni-container -->
</div><!-- /viewer-wrap -->

<!-- FOOTER -->
<div id="footer">

  <div id="clock">
    <div class="clock-block">
      <div class="digit" id="h1">0</div>
      <div class="digit" id="h2">0</div>
    </div>
    <div class="sep">:</div>
    <div class="clock-block">
      <div class="digit" id="m1">0</div>
      <div class="digit" id="m2">0</div>
    </div>
    <div class="digit-sec">
      <div class="d" id="s1">0</div>
      <div class="d" id="s2">0</div>
    </div>

var REFRESH_INTERVAL_MS = 5000; // 5 secondi — aggiornamento live

function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function padTime(t) {
  if (!t) return t;
  var parts = t.split(':');
  if (parts.length < 2) return t;
  return pad2(parseInt(parts[0], 10)) + ':' + parts[1];
}

var GIORNI = ['Domenica','Lunedi','Martedi','Mercoledi','Giovedi','Venerdi','Sabato'];

var lastUpdated = null;

/* ── LOADER BAR ── */
function startLoaderBar() {
  var bar = document.getElementById('loader-bar');
  bar.className = '';
  bar.style.width = '0%';
  void bar.offsetWidth;
  bar.className = 'running';
}
function stopLoaderBar() {
  var bar = document.getElementById('loader-bar');
  bar.style.width = '100%';
  bar.style.opacity = '0';
  setTimeout(function() { bar.className = ''; bar.style.width = '0%'; bar.style.opacity = ''; }, 400);
}

/* ── ICONA REFRESH ── */
function setRefreshIcon(loading) {
  var icon = document.getElementById('refresh-icon');
  if (loading) {
    icon.innerHTML = '&#x21BB;';
    icon.className = 'spinning';
    icon.style.color = '#3b82f6';
  } else {
    icon.innerHTML = '&#x2714;';
    icon.className = '';
    icon.style.color = '#22c55e';
  }
}

/* ── STATUS ── */
function updateRefreshStatus() {
  if (!lastUpdated) return;
  document.getElementById('refresh-text').textContent =
    'Aggiornato alle ' + pad2(lastUpdated.getHours()) + ':' + pad2(lastUpdated.getMinutes());
}

function updateNextRefresh() {
  if (!nextRefresh) return;
  var diff = Math.max(0, Math.floor((nextRefresh - Date.now()) / 1000));
  var mm = Math.floor(diff / 60);
  var ss = diff % 60;
  var nr = new Date(nextRefresh);
  document.getElementById('next-time').textContent = pad2(nr.getHours()) + ':' + pad2(nr.getMinutes());
  document.getElementById('countdown').textContent = 'tra ' + pad2(mm) + ':' + pad2(ss);
}

/* ── OROLOGIO ── */
function updateClock() {
  var now = new Date();
  var h = pad2(now.getHours());
  var m = pad2(now.getMinutes());
  var s = pad2(now.getSeconds());
  document.getElementById('h1').textContent = h[0];
  document.getElementById('h2').textContent = h[1];
  document.getElementById('m1').textContent = m[0];
  document.getElementById('m2').textContent = m[1];
  document.getElementById('s1').textContent = s[0];
  document.getElementById('s2').textContent = s[1];

  var g  = GIORNI[now.getDay()];
  var d  = now.getDate();
  var me = MESI[now.getMonth()];
  var y  = now.getFullYear();
  document.getElementById('data-completa').textContent = g + '  ' + d + ' ' + me + ' ' + y;

  updateNextRefresh();
}

function getMondayOfWeek(d) {
  var copy = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var dow = copy.getDay();
  var diff = (dow === 0) ? -6 : 1 - dow;
  copy.setDate(copy.getDate() + diff);
  var y = copy.getFullYear();
  var m = String(copy.getMonth() + 1).padStart(2, '0');
  var day = String(copy.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function getTodayDayIdx() {
  var dow = new Date().getDay();
  return (dow === 0) ? 6 : dow - 1; // 0=Lun ... 5=Sab
}

function getSlotForDay(dayIdx, session) {
  return dayIdx + '_' + session;
}

// getSlotData: legge slots[dayIdx] come oggetto o stringa (compatibile con Supabase/Situazione-medici)
function getSlotData(slots, dayIdx) {
  if (!slots) return null;
  if (Array.isArray(slots)) return slots[dayIdx] || null;
  if (typeof slots === 'object') return slots[String(dayIdx)] || null;
  return null;
}

function parseOrario(val) {
  if (!val) return null;
  // Se è già un oggetto nel formato atteso {mattina, pomeriggio, generic}
  if (typeof val === 'object') {
    if (val.mattina || val.pomeriggio || val.generic) return val;
    // Oggetto {start, end} → generico
    if (val.start !== undefined) return { generic: { start: val.start || '', end: val.end || '' } };
    return null;
  }
  var s = String(val).trim();
  // Formato "HH:MM-HH:MM" o "HH:MM – HH:MM"
  var rangeMatch = s.match(/^(\d{1,2}:\d{2})\s*[-\u2013]\s*(\d{1,2}:\d{2})$/);
  if (rangeMatch) return { generic: { start: rangeMatch[1], end: rangeMatch[2] } };
  // Singola ora "HH:MM"
  var timeMatch = s.match(/^(\d{1,2}:\d{2})$/);
  if (timeMatch) return { generic: { start: timeMatch[1], end: '' } };
  return null;
}

function resolveOrario(docData, dayIdx, session) {
  if (!docData) return null;
  // Cerca campo orario nell'oggetto docData (da Firebase RTDB weeks)
  var orarioData = docData.orario || docData.orario_ecg || null;
  if (orarioData) {
    if (typeof orarioData === 'string') return parseOrario(orarioData);
    if (typeof orarioData === 'object') {
      if (orarioData.mattina || orarioData.pomeriggio || orarioData.generic) return orarioData;
      var sess = session && orarioData[session];
      if (sess) return { generic: { start: sess.start || String(sess), end: sess.end || '' } };
    }
  }
  // Campi specifici per sessione: orario_mattina_start / orario_pomeriggio_start
  var sessKey = session || 'mattina';
  var sf = 'orario_' + sessKey + '_start', ef = 'orario_' + sessKey + '_end';
  if (docData[sf]) return { generic: { start: docData[sf], end: docData[ef] || '' } };
  // Campi generici: orario_start / orario_end
  if (docData.orario_start) return { generic: { start: docData.orario_start, end: docData.orario_end || '' } };
  return null;
}

function matchCardiologo(name, list) {
  if (!list || !list.length) return null;
  var n = (name || '').toLowerCase().trim();
  for (var i = 0; i < list.length; i++) {
    var item = list[i];
    var ln = ((item.nome || item.name || '') + ' ' + (item.cognome || '')).toLowerCase().trim();
    if (ln === n || (item.cognome || '').toLowerCase() === n) return item;
    if ((item.label || '').toLowerCase().includes(n) || n.includes((item.cognome || '').toLowerCase())) return item;
  }
  return null;
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fetchAllData(callback) {
  var weekKey = getMondayOfWeek(new Date());
  var pending = 10;
  var results = {};

  function done(key, val) {
    results[key] = val;
    pending--;
    if (pending === 0) callback(results);
  }

  // ── Supabase: holter_counts ──────────────────────────────────────────────
  var holterUrl = SUPABASE_URL + '/rest/v1/holter_counts?week_key=eq.' + encodeURIComponent(weekKey) + '&select=*';
  fetch(holterUrl, { headers: _sbHeaders })
    .then(function(r) { return r.json(); })
    .then(function(rows) {
      var d = (rows && rows[0]) || {};
      var hcMap = {}, hcExists = {};
      var hcRaw = d.hc || {};
      Object.keys(hcRaw).forEach(function(k) {
        var n = parseInt(hcRaw[k]); if (!isNaN(n)) { hcMap[k] = n; hcExists[k] = true; }
      });
      var hpMap = {}, hpExists = {};
      var hpRaw = d.hp || {};
      Object.keys(hpRaw).forEach(function(k) {
        var n = parseInt(hpRaw[k]); if (!isNaN(n)) { hpMap[k] = n; hpExists[k] = true; }
      });
      var spMap = {}, spExists = {};
      var spRaw = d.spiro || {};
      Object.keys(spRaw).forEach(function(k) {
        var n = parseInt(spRaw[k]); if (!isNaN(n) && n > 0) { spMap[k] = n; spExists[k] = true; }
      });
      var plMap = {}, plExists = {};
      var plRaw = d.pls || {};
      Object.keys(plRaw).forEach(function(k) {
        var n = parseInt(plRaw[k]); if (!isNaN(n) && n > 0) { plMap[k] = n; plExists[k] = true; }
      });
      results.hcCountsMap     = hcMap;    results.hcCountsExists    = hcExists;
      results.hpCountsMap     = hpMap;    results.hpCountsExists    = hpExists;
      results.spiroCountsMap  = spMap;    results.spiroCountsExists = spExists;
      results.plsCountsMap    = plMap;    results.plsCountsExists   = plExists;
      results.ecgTimesRaw     = d.ecg_times || {};
      done('ecgTimes', results.ecgTimesRaw);
    })
    .catch(function(e) {
      console.warn('holter_counts fetch error:', e);
      results.hcCountsMap = {}; results.hcCountsExists = {};
      results.hpCountsMap = {}; results.hpCountsExists = {};
      results.spiroCountsMap = {}; results.spiroCountsExists = {};
      results.plsCountsMap = {}; results.plsCountsExists = {};
      results.ecgTimesRaw = {};
      done('ecgTimes', {});
    });

  // ── Supabase: kv_store → turni_medici/turni ──────────────────────────────
  var turniUrl = SUPABASE_URL + '/rest/v1/kv_store?id=eq.turni_medici%2Fturni&select=data';
  fetch(turniUrl, { headers: _sbHeaders })
    .then(function(r) { return r.json(); })
    .then(function(rows) {
      var data = (rows && rows[0] && rows[0].data) || {};
      done('turni', data.lista || []);
    })
    .catch(function(e) { console.warn('turni fetch error:', e); done('turni', []); });

  // ── Supabase: kv_store → turni_medici/cardiologists ──────────────────────
  var cardUrl = SUPABASE_URL + '/rest/v1/kv_store?id=eq.turni_medici%2Fcardiologists&select=data';
  fetch(cardUrl, { headers: _sbHeaders })
    .then(function(r) { return r.json(); })
    .then(function(rows) {
      var data = (rows && rows[0] && rows[0].data) || {};
      done('cardiologists', data.lista || []);
    })
    .catch(function(e) { console.warn('cardiologists fetch error:', e); done('cardiologists', []); });
  // ── Supabase: kv_store → ecg_orari/{weekKey} ─────────────────────────
  var ecgOrariUrl = SUPABASE_URL + '/rest/v1/kv_store?id=eq.' + encodeURIComponent('ecg_orari/' + weekKey) + '&select=data';
  fetch(ecgOrariUrl, { headers: _sbHeaders })
    .then(function(r) { return r.json(); })
    .then(function(rows) {
      var d = (rows && rows[0] && rows[0].data) || null;
      done('ecgOrari', d);
    })
    .catch(function(e) { console.warn('ecg_orari fetch error:', e); done('ecgOrari', null); });

  // ── Supabase cardio_state (priorità) + Firebase RTDB (fallback) ──
  var rtdbPaths = ['weeks', 'holterWeeks', 'hcWeeks', 'hpWeeks', 'spiroWeeks', 'plsWeeks'];
  rtdbPaths.forEach(function(pathName) {
    var csPath = 'cardio_state/' + pathName + '/' + weekKey;
    var csUrl = SUPABASE_URL + '/rest/v1/cardio_state?path=eq.' + encodeURIComponent(csPath) + '&select=data';
    fetch(csUrl, { headers: _sbHeaders })
      .then(function(r) { return r.json(); })
      .then(function(rows) {
        if (rows && rows[0] && rows[0].data !== undefined && rows[0].data !== null) {
          console.log('[cardio_state] Dati da Supabase per:', pathName);
          done(pathName, rows[0].data);
        } else {
          // Fallback Firebase RTDB
          console.log('[cardio_state] Nessun dato Supabase, fallback Firebase per:', pathName);
          _fbAuthTokenPromise.then(function(token) {
            var url = RTDB_BASE + '/cardio_state/' + pathName + '/' + encodeURIComponent(weekKey) + '.json';
            if (token) url += '?auth=' + encodeURIComponent(token);
            fetch(url)
              .then(function(r) { return r.json(); })
              .then(function(data) { done(pathName, data || {}); })
              .catch(function(e) { console.warn(pathName + ' Firebase fetch error:', e); done(pathName, {}); });
          });
        }
      })
      .catch(function(e) {
        console.warn(pathName + ' Supabase error, fallback Firebase:', e);
        _fbAuthTokenPromise.then(function(token) {
          var url = RTDB_BASE + '/cardio_state/' + pathName + '/' + encodeURIComponent(weekKey) + '.json';
          if (token) url += '?auth=' + encodeURIComponent(token);
          fetch(url)
            .then(function(r) { return r.json(); })
            .then(function(data) { done(pathName, data || {}); })
            .catch(function(e2) { console.warn(pathName + ' Firebase fetch error:', e2); done(pathName, {}); });
        });
      });
  });
}


function processAndRender(data) {
  var dayIdx = getTodayDayIdx();
  var weeks = data.weeks || {};
  var cardiologists = data.cardiologists || [];

  // === TURNO COMPLETO & SOLO ECG per sessione ===
  var tcMattina = [], ecgMattina = [];
  var tcPomeriggio = [], ecgPomeriggio = [];

  var slotKeyM = dayIdx + '_0';
  var slotKeyP = dayIdx + '_1';

  for (var docKey in weeks) {
    if (!weeks.hasOwnProperty(docKey)) continue;
    var docData = weeks[docKey];
    if (!docData || docData.ferie || !docData.slots) continue;
    var docName = docKey.replace(/\u00B7/g, '.');
    var slots = docData.slots;

    // Mattina
    var slotM = null;
    if (typeof slots === 'object' && !Array.isArray(slots)) {
      slotM = slots[slotKeyM] || null;
    }
    if (slotM === 'confermato') tcMattina.push({ name: docName, key: docKey });
    else if (slotM === 'confermato-ecg') ecgMattina.push({ name: docName, key: docKey });

    // Pomeriggio
    var slotP = null;
    if (typeof slots === 'object' && !Array.isArray(slots)) {
      slotP = slots[slotKeyP] || null;
    }
    if (slotP === 'confermato') tcPomeriggio.push({ name: docName, key: docKey });
    else if (slotP === 'confermato-ecg') ecgPomeriggio.push({ name: docName, key: docKey });
  }

  tcMattina.sort(function(a, b) { return a.name.localeCompare(b.name, 'it'); });
  ecgMattina.sort(function(a, b) { return a.name.localeCompare(b.name, 'it'); });
  tcPomeriggio.sort(function(a, b) { return a.name.localeCompare(b.name, 'it'); });
  ecgPomeriggio.sort(function(a, b) { return a.name.localeCompare(b.name, 'it'); });

  // === HOLTER TURNI ===
  var holterDocs = [];
  var holterWeeks = data.holterWeeks || {};
  for (var dk in holterWeeks) {
    if (!holterWeeks.hasOwnProperty(dk)) continue;
    var hd = holterWeeks[dk];
    if (!hd || hd.ferie) continue;
    var hSlot = getSlotData(hd.slots, dayIdx);
    if (hSlot !== 'confermato') continue;
    holterDocs.push({ name: dk.replace(/\u00B7/g, '.'), key: dk });
  }
  holterDocs.sort(function(a, b) { return a.name.localeCompare(b.name, 'it'); });

  // === CONSUNTIVO HC ===
  var hcDocs = [];
  var hcWeeks = data.hcWeeks || {};
  for (var dk in hcWeeks) {
    if (!hcWeeks.hasOwnProperty(dk)) continue;
    var hcd = hcWeeks[dk];
    if (!hcd || hcd.ferie) continue;
    var hcSlot = getSlotData(hcd.slots, dayIdx);
    if (!hcSlot) continue;
    var hcMax = hcSlot.num || hcSlot.val || '';
    hcDocs.push({ name: dk.replace(/\u00B7/g, '.'), key: dk, max: hcMax });
  }
  hcDocs.sort(function(a, b) { return a.name.localeCompare(b.name, 'it'); });

  // === CONSUNTIVO HP ===
  var hpDocs = [];
  var hpWeeks = data.hpWeeks || {};
  for (var dk in hpWeeks) {
    if (!hpWeeks.hasOwnProperty(dk)) continue;
    var hpd = hpWeeks[dk];
    if (!hpd || hpd.ferie) continue;
    var hpSlot = getSlotData(hpd.slots, dayIdx);
    if (!hpSlot) continue;
    var hpMax = hpSlot.num || hpSlot.val || '';
    hpDocs.push({ name: dk.replace(/\u00B7/g, '.'), key: dk, max: hpMax });
  }
  hpDocs.sort(function(a, b) { return a.name.localeCompare(b.name, 'it'); });

  // === SPIROMETRIA ===
  var spiroDocs = [];
  var spiroWeeks = data.spiroWeeks || {};
  for (var dk in spiroWeeks) {
    if (!spiroWeeks.hasOwnProperty(dk)) continue;
    var spd = spiroWeeks[dk];
    if (!spd || spd.ferie) continue;
    var spSlot = getSlotData(spd.slots, dayIdx);
    if (!spSlot) continue;
    spiroDocs.push({ name: dk.replace(/\u00B7/g, '.'), key: dk });
  }
  spiroDocs.sort(function(a, b) { return a.name.localeCompare(b.name, 'it'); });

  // === POLISONNOGRAFIA ===
  var plsDocs = [];
  var plsWeeks = data.plsWeeks || {};
  for (var dk in plsWeeks) {
    if (!plsWeeks.hasOwnProperty(dk)) continue;
    var pld = plsWeeks[dk];
    if (!pld || pld.ferie) continue;
    var plSlot = getSlotData(pld.slots, dayIdx);
    if (!plSlot) continue;
    plsDocs.push({ name: dk.replace(/\u00B7/g, '.'), key: dk });
  }
  plsDocs.sort(function(a, b) { return a.name.localeCompare(b.name, 'it'); });

  // ══════════════════════════════════════════
  // RENDERING
  // ══════════════════════════════════════════

  // Turno completo & Solo ECG
  renderDocList('tc-mattina', tcMattina);
  renderDocList('tc-pomeriggio', tcPomeriggio);
  // Solo ECG con orario renderizzato direttamente nella card

  // Holter Cardiaco: turni holter prima, poi consuntivo HC con disponibilità
  var holterCLines = [];
  for (var i = 0; i < holterDocs.length; i++) {
    var htDoc = holterDocs[i];
    var htHcKey = 'd' + dayIdx + '_hc_' + htDoc.key;
    var htHpKey = 'd' + dayIdx + '_hp_' + htDoc.key;
    var htHcDone = !!(data.hcCountsExists || {})[htHcKey] && ((data.hcCountsMap || {})[htHcKey] || 0) >= 10;
    var htHpDone = !!(data.hpCountsExists || {})[htHpKey] && ((data.hpCountsMap || {})[htHpKey] || 0) >= 10;
    var htAllDone = htHcDone && htHpDone;
    var htColor = htAllDone ? '#4ade80' : '#f48fb1';
    holterCLines.push('<span class="n" style="color:' + htColor + ';">' + esc(htDoc.name) + '</span>');
  }
  if (holterDocs.length > 0 && hcDocs.length > 0) {
    holterCLines.push('<span class="n" style="font-size: 11px;opacity:0.4;letter-spacing:2px;column-span:all;">── CONSUNTIVO ──</span>');
  }
  for (var i = 0; i < hcDocs.length; i++) {
    var hcDoc = hcDocs[i];
    var hcCountKey = 'd' + dayIdx + '_hc_' + hcDoc.key;
    var hcMax = parseInt(hcDoc.max) || 0;
    var hcHasCount = !!(data.hcCountsExists || {})[hcCountKey];
    var hcCountVal = hcHasCount ? ((data.hcCountsMap || {})[hcCountKey] || 0) : 0;
    var t;
    if (hcHasCount && hcMax > 0 && hcCountVal >= hcMax) {
      // Completo: nome verde + disponibilità max tra parentesi
      t = '<span style="color:#4ade80;">' + esc(hcDoc.name) + ' <span style="font-size: 21px;font-weight:600;opacity:.75;">(' + esc(String(hcMax)) + ')</span></span>';
    } else if (hcHasCount && hcCountVal > 0 && hcMax > 0) {
      // Parziale: nome + (N su MAX)
      t = esc(hcDoc.name) + ' <span style="font-size: 21px;font-weight:600;opacity:.75;">(' + hcCountVal + ' su ' + esc(String(hcMax)) + ')</span>';
    } else if (hcMax > 0) {
      // Nessun conteggio: solo MAX
      t = esc(hcDoc.name) + ' <span style="font-size: 21px;font-weight:600;opacity:.75;">(' + esc(String(hcMax)) + ')</span>';
    } else {
      t = esc(hcDoc.name);
    }
    holterCLines.push('<span class="n">'+t+'</span>');
  }
  document.getElementById('esame-holterc').innerHTML = holterCLines.length
    ? holterCLines.join('')
    : '<span class="esame-empty">\u2014</span>';

  // Holter Pressorio: consuntivo HP
  var hpLines = [];
  for (var i = 0; i < hpDocs.length; i++) {
    var hpDoc = hpDocs[i];
    var hpCountKey = 'd' + dayIdx + '_hp_' + hpDoc.key;
    var hpMax = parseInt(hpDoc.max) || 0;
    var hpHasCount = !!(data.hpCountsExists || {})[hpCountKey];
    var hpCountVal = hpHasCount ? ((data.hpCountsMap || {})[hpCountKey] || 0) : 0;
    var t;
    if (hpHasCount && hpMax > 0 && hpCountVal >= hpMax) {
      // Completo: nome verde + disponibilità max tra parentesi
      t = '<span style="color:#4ade80;">' + esc(hpDoc.name) + ' <span style="font-size: 21px;font-weight:600;opacity:.75;">(' + esc(String(hpMax)) + ')</span></span>';
    } else if (hpHasCount && hpCountVal > 0 && hpMax > 0) {
      t = esc(hpDoc.name) + ' <span style="font-size: 21px;font-weight:600;opacity:.75;">(' + hpCountVal + ' su ' + esc(String(hpMax)) + ')</span>';
    } else if (hpMax > 0) {
      t = esc(hpDoc.name) + ' <span style="font-size: 21px;font-weight:600;opacity:.75;">(' + esc(String(hpMax)) + ')</span>';
    } else {
      t = esc(hpDoc.name);
    }
    hpLines.push('<span class="n">'+t+'</span>');
  }
  document.getElementById('esame-holterp').innerHTML = hpLines.length
    ? hpLines.join('')
    : '<span class="esame-empty">\u2014</span>';

  // Spirometria
  var spiroLines = [];
  for (var i = 0; i < spiroDocs.length; i++) {
    var spDoc = spiroDocs[i];
    var spKey = 'd' + dayIdx + '_sp_' + spDoc.key;
    var spCount = (data.spiroCountsExists || {})[spKey] ? ((data.spiroCountsMap || {})[spKey] || 0) : 0;
    var spLabel = esc(spDoc.name);
    if (spCount > 0) {
      spLabel += ' <span style="font-size: 21px;font-weight:600;opacity:.75;">(agg. ' + spCount + ')</span>';
    }
    spiroLines.push('<span class="n">' + spLabel + '</span>');
  }
  document.getElementById('esame-spiro').innerHTML = spiroLines.length
    ? spiroLines.join('')
    : '<span class="esame-empty">\u2014</span>';

  // Polisonnografia
  var plsLines = [];
  for (var i = 0; i < plsDocs.length; i++) {
    var plDoc = plsDocs[i];
    var plKey = 'd' + dayIdx + '_pls_' + plDoc.key;
    var plCount = (data.plsCountsExists || {})[plKey] ? ((data.plsCountsMap || {})[plKey] || 0) : 0;
    var plLabel = esc(plDoc.name);
    if (plCount > 0) {
      plLabel += ' <span style="font-size: 21px;font-weight:600;opacity:.75;">(agg. ' + plCount + ')</span>';
    }
    plsLines.push('<span class="n">' + plLabel + '</span>');
  }
  document.getElementById('esame-polison').innerHTML = plsLines.length
    ? plsLines.join('')
    : '<span class="esame-empty">\u2014</span>';

  // ECG Orari — usa ecg_orari da kv_store (Supabase) come fonte primaria,
  // con fallback a holter_counts.ecg_times + Firebase per retrocompatibilità
  var ecgOrari   = data.ecgOrari || null;
  var ecgTimes   = data.ecgTimes || {};
  var ecgOrariDay = null;
  if (ecgOrari && ecgOrari.orari) {
    ecgOrariDay = ecgOrari.orari[String(dayIdx)] || null;
  }

  function getEcgOrarioFromKv(docKey, session) {
    if (!ecgOrariDay) return null;
    var list = ecgOrariDay[session] || [];
    for (var x = 0; x < list.length; x++) {
      if (list[x].key === docKey || list[x].name === docKey) {
        return { start: list[x].orario_start || '', end: list[x].orario_end || '', tipo: list[x].tipo || '' };
      }
    }
    return null;
  }

  var ecgMattinaRows = [];
  var ecgPomeriggioRows = [];

  for (var i = 0; i < ecgMattina.length; i++) {
    var docKey = ecgMattina[i].key;
    var matched = matchCardiologo(docKey, cardiologists);
    var docData = weeks[docKey];
    var oraDa = '', oraA = '';

    // 1) Fonte primaria: ecg_orari/{weekKey} su kv_store
    var kvOra = getEcgOrarioFromKv(docKey, 'mattina');
    if (kvOra) {
      oraDa = kvOra.start;
      oraA  = kvOra.end;
    } else {
      // 2) Fallback: ecgTimes (holter_counts) + resolveOrario (Firebase)
      var ecgStartKey = 'd' + dayIdx + '_s0_ecg_start_' + docKey;
      var ecgEndKey   = 'd' + dayIdx + '_s0_ecg_end_'   + docKey;
      var userStart = ecgTimes[ecgStartKey] || '';
      var userEnd   = ecgTimes[ecgEndKey]   || '';
      var orario = resolveOrario(docData, dayIdx, 'mattina');
      if (!orario && matched && matched.orario) { orario = parseOrario(matched.orario); }
      if (orario && orario.mattina) { oraDa = orario.mattina.start; oraA = orario.mattina.end; }
      else if (orario && orario.generic) { oraDa = orario.generic.start; oraA = orario.generic.end; }
      if (userStart) oraDa = userStart;
      if (userEnd)   oraA  = userEnd;
    }

    var ecgBadge = (kvOra && kvOra.tipo) ? kvOra.tipo : '';
    if (!ecgBadge && matched) {
      if (matched.ecg100 === true) ecgBadge = 'ECG 100';
      else if (matched.ecg75 === true) ecgBadge = 'ECG 75';
    }
    if (!ecgBadge && docData) {
      if (docData.ecg100 === true) ecgBadge = 'ECG 100';
      else if (docData.ecg75 === true) ecgBadge = 'ECG 75';
    }
    ecgMattinaRows.push({ medico: ecgMattina[i].name, oraDa: oraDa, oraA: oraA, ecgBadge: ecgBadge });
  }

  for (var i = 0; i < ecgPomeriggio.length; i++) {
    var docKey = ecgPomeriggio[i].key;
    var matched = matchCardiologo(docKey, cardiologists);
    var docData = weeks[docKey];
    var oraDaP = '', oraAP = '';

    // 1) Fonte primaria: ecg_orari/{weekKey} su kv_store
    var kvOraP = getEcgOrarioFromKv(docKey, 'pomeriggio');
    if (kvOraP) {
      oraDaP = kvOraP.start;
      oraAP  = kvOraP.end;
    } else {
      // 2) Fallback: ecgTimes (holter_counts) + resolveOrario (Firebase)
      var ecgStartKeyP = 'd' + dayIdx + '_s1_ecg_start_' + docKey;
      var ecgEndKeyP   = 'd' + dayIdx + '_s1_ecg_end_'   + docKey;
      var userStartP = ecgTimes[ecgStartKeyP] || '';
      var userEndP   = ecgTimes[ecgEndKeyP]   || '';
      var orario = resolveOrario(docData, dayIdx, 'pomeriggio');
      if (!orario && matched && matched.orario) { orario = parseOrario(matched.orario); }
      if (orario && orario.pomeriggio) { oraDaP = orario.pomeriggio.start; oraAP = orario.pomeriggio.end; }
      else if (orario && orario.generic) { oraDaP = orario.generic.start; oraAP = orario.generic.end; }
      if (userStartP) oraDaP = userStartP;
      if (userEndP)   oraAP  = userEndP;
    }

    var ecgBadge = (kvOraP && kvOraP.tipo) ? kvOraP.tipo : '';
    if (!ecgBadge && matched) {
      if (matched.ecg100 === true) ecgBadge = 'ECG 100';
      else if (matched.ecg75 === true) ecgBadge = 'ECG 75';
    }
    if (!ecgBadge && docData) {
      if (docData.ecg100 === true) ecgBadge = 'ECG 100';
      else if (docData.ecg75 === true) ecgBadge = 'ECG 75';
    }
    ecgPomeriggioRows.push({ medico: ecgPomeriggio[i].name, oraDa: oraDaP, oraA: oraAP, ecgBadge: ecgBadge });
  }
  renderEcgInCard('wrap-ecg-mattina', ecgMattinaRows);
  renderEcgInCard('wrap-ecg-pomeriggio', ecgPomeriggioRows);
  updateEcgDots();
}

/* ── ECG STATUS DOTS UPDATE ── */
function timeToMin(t) {
  if (!t) return -1;
  var parts = t.split(':');
  if (parts.length < 2) return -1;
  var h = parseInt(parts[0], 10);
  var m = parseInt(parts[1], 10);
  if (isNaN(h) || isNaN(m)) return -1;
  return h * 60 + m;
}

function updateEcgDots() {
  var now = new Date();
  var nowMin = now.getHours() * 60 + now.getMinutes();
  var dots = document.querySelectorAll('.ecg-status-dot');
  for (var i = 0; i < dots.length; i++) {
    var dot = dots[i];
    var start = timeToMin(dot.getAttribute('data-start'));
    var end   = timeToMin(dot.getAttribute('data-end'));
    if (start < 0 || end < 0) {
      dot.className = 'ecg-status-dot gray';
    } else if (nowMin >= start && nowMin < end) {
      dot.className = 'ecg-status-dot green';
    } else if (nowMin >= (start - 15) && nowMin < start) {
      dot.className = 'ecg-status-dot yellow';
    } else {
      dot.className = 'ecg-status-dot red';
    }
  }
}

function renderDocList(elId, docs) {
  var el = document.getElementById(elId);
  if (!docs || !docs.length) {
    el.innerHTML = '<span class="doc-empty">\u2014</span>';
    return;
  }
  el.innerHTML = docs.map(function(d) { return esc(d.name); }).join('<br>');
}

function renderEcgInCard(wrapId, rows) {
  var wrap = document.getElementById(wrapId);
  if (!rows || !rows.length) {
    wrap.innerHTML = '<span class="doc-empty">\u2014</span>';
    return;
  }
  wrap.style.alignItems = 'stretch';
  wrap.style.padding = '0';
  wrap.style.gap = '0';
  var html = '';
  rows.forEach(function(r) {
    var ora = (r.oraDa && r.oraA)
      ? esc(padTime(r.oraDa)) + ' \u2013 ' + esc(padTime(r.oraA))
      : esc(padTime(r.oraDa) || '');
    html += '<div class="ecg-row">';
    html += '<span class="ecg-status-dot gray" data-start="' + esc(r.oraDa || '') + '" data-end="' + esc(r.oraA || '') + '"></span>';
    html += '<div class="ecg-doc-wrap">';
    html += '<span class="ecg-doctor">' + esc(r.medico || '') + '</span>';
    if (r.ecgBadge) html += '<span class="ecg-badge-chip">' + esc(r.ecgBadge) + '</span>';
    html += '</div>';
    if (ora) html += '<span class="ecg-time">' + ora + '</span>';
    html += '</div>';
  });
  wrap.innerHTML = html;
}

function renderEcg(rows) {
  var wrap = document.getElementById('ecg-cols');
  if (!rows || !rows.length) {
    wrap.innerHTML = '<div class="ecg-empty" style="grid-column:1/-1;">Nessun cardiologo solo ECG</div>';
    return;
  }
  var mattina    = rows.filter(function(r) { return r.turno === 'mattina'; });
  var pomeriggio = rows.filter(function(r) { return r.turno === 'pomeriggio'; });

  var MAX_PER_COL = 4;

  // Suddivide un array in chunk di max N elementi
  function chunkArr(arr, n) {
    var out = [];
    if (!arr.length) { out.push([]); return out; }
    for (var i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n));
    return out;
  }

  // Genera HTML per una sotto-colonna
  function subColHtml(list, cls, label, showLabel) {
    var h = '<div>';
    h += '<div class="ecg-col-label ' + cls + '"' +
         (showLabel ? '' : ' style="visibility:hidden;"') + '>' + label + '</div>';
    if (!list.length) {
      h += '<div class="ecg-empty">\u2014</div>';
    } else {
      list.forEach(function(r) {
        var ora = (r.oraDa && r.oraA) ? esc(padTime(r.oraDa)) + ' \u2013 ' + esc(padTime(r.oraA)) : esc(padTime(r.oraDa) || '');
        h += '<div class="ecg-row">';
        h += '<span class="ecg-status-dot gray" data-start="' + esc(r.oraDa || '') + '" data-end="' + esc(r.oraA || '') + '"></span>';
        h += '<div class="ecg-doc-wrap">';
        h += '<span class="ecg-doctor">' + esc(r.medico || '') + '</span>';
        if (r.ecgBadge) h += '<span class="ecg-badge-chip">' + esc(r.ecgBadge) + '</span>';
        h += '</div>';
        h += '<span class="ecg-time">' + ora + '</span>';
        h += '</div>';
      });
    }
    h += '</div>';
    return h;
  }

  var mattinaChunks    = chunkArr(mattina,    MAX_PER_COL);
  var pomeriggioChunks = chunkArr(pomeriggio, MAX_PER_COL);

  // Calcola il grid template dinamico:
  // [M-col…] [thin-div] [M-col…] … [MAIN-DIV 2px] [P-col…] [thin-div] [P-col…] …
  var tpl = [];
  for (var i = 0; i < mattinaChunks.length; i++) {
    if (i > 0) tpl.push('1px');
    tpl.push('1fr');
  }
  tpl.push('2px'); // divisore centrale Mattina / Pomeriggio
  for (var j = 0; j < pomeriggioChunks.length; j++) {
    if (j > 0) tpl.push('1px');
    tpl.push('1fr');
  }
  wrap.style.gridTemplateColumns = tpl.join(' ');

  var html = '';
  // Colonne Mattina
  for (var i = 0; i < mattinaChunks.length; i++) {
    if (i > 0) html += '<div class="ecg-col-divider"></div>';
    html += subColHtml(mattinaChunks[i], 'm', 'Mattina', i === 0);
  }
  // Divisore centrale
  html += '<div class="ecg-col-divider" style="background:rgba(99,102,241,.45);"></div>';
  // Colonne Pomeriggio
  for (var j = 0; j < pomeriggioChunks.length; j++) {
    if (j > 0) html += '<div class="ecg-col-divider"></div>';
    html += subColHtml(pomeriggioChunks[j], 'p', 'Pomeriggio', j === 0);
  }

  wrap.innerHTML = html;
}

/* ── RELOAD ── */
function reloadTurni() {
  if (reloading) return;
  reloading = true;
  setRefreshIcon(true);
  startLoaderBar();

  fetchAllData(function(data) {
    window._lastCalData = data;
    processAndRender(data);
    reloading = false;
    stopLoaderBar();
    setRefreshIcon(false);
    lastUpdated = new Date();
    updateRefreshStatus();
  });
}

/* ── AVVIO ── */
(function init() {
  // Primo render: fetch dati da Firebase
  setRefreshIcon(true);
  startLoaderBar();
  fetchAllData(function(data) {
    window._lastCalData = data;
    processAndRender(data);
    stopLoaderBar();
    setRefreshIcon(false);
    lastUpdated = new Date();
    updateRefreshStatus();

    /* ── Supabase Realtime: aggiorna ECG istantaneamente ──────────────────
       Ascolta INSERT/UPDATE su holter_counts (dove index.html salva gli
       orari ECG manuali in ecg_times) e su kv_store (aggregato).
       Al cambio ri-renderizza la tabella ECG senza attendere il refresh.  */
    (function setupEcgRealtime() {
      if (!_supabaseClient) {
        console.warn('[ECG Realtime] Supabase JS non disponibile, skip realtime.');
        return;
      }
      var _weekKey = getMondayOfWeek(new Date());

      /* ── 1. holter_counts → fonte primaria degli orari manuali ── */
      _supabaseClient
        .channel('ecg-holter-' + _weekKey)
        .on(
          'postgres_changes',
          {
            event: '*',
            schema: 'public',
            table: 'holter_counts',
            filter: 'week_key=eq.' + _weekKey
          },
          function(payload) {
            console.log('[ECG Realtime] holter_counts aggiornato:', payload.eventType);
            if (!window._lastCalData) return;
            /* Aggiorna ecgTimesRaw con i nuovi orari manuali */
            var newRow = payload.new || {};
            if (newRow.ecg_times !== undefined) {
              window._lastCalData.ecgTimesRaw = newRow.ecg_times || {};
            }
            /* Ri-fetch kv_store in parallelo per aggiornare anche ecgOrari */
            var kvUrl = SUPABASE_URL + '/rest/v1/kv_store?id=eq.' + encodeURIComponent('ecg_orari/' + _weekKey) + '&select=data';
            fetch(kvUrl, { headers: _sbHeaders })
              .then(function(r) { return r.json(); })
              .then(function(arr) {
                if (arr && arr[0] && arr[0].data) {
                  window._lastCalData.ecgOrari = arr[0].data;
                }
                processAndRender(window._lastCalData);
                console.log('[ECG Realtime] ECG aggiornato da holter_counts.');
              })
              .catch(function() {
                /* kv_store non ancora aggiornato, usa solo ecgTimesRaw */
                window._lastCalData.ecgOrari = null;
                processAndRender(window._lastCalData);
                console.log('[ECG Realtime] ECG aggiornato (solo ecgTimesRaw).');
              });
          }
        )
        .subscribe(function(status) {
          console.log('[ECG Realtime] holter_counts canale →', status);
        });

      /* ── 2. cardio_state → aggiornamenti scheduling (weeks, hcWeeks, ecc.) ── */
      var _csPaths = ['weeks', 'holterWeeks', 'hcWeeks', 'hpWeeks', 'spiroWeeks', 'plsWeeks'];
      _csPaths.forEach(function(pathName) {
        var csPath = 'cardio_state/' + pathName + '/' + _weekKey;
        _supabaseClient
          .channel('cs-' + pathName + '-' + _weekKey)
          .on(
            'postgres_changes',
            {
              event: '*',
              schema: 'public',
              table: 'cardio_state',
              filter: 'path=eq.' + csPath
            },
            function(payload) {
              console.log('[Realtime] cardio_state aggiornato:', pathName, payload.eventType);
              if (!window._lastCalData) return;
              if (payload.new && payload.new.data !== undefined) {
                window._lastCalData[pathName] = payload.new.data;
                processAndRender(window._lastCalData);
              }
            }
          )
          .subscribe(function(status) {
            console.log('[Realtime] cardio_state canale ' + pathName + ' →', status);
          });
      });

      /* ── 3. kv_store → copertura per aggiornamenti aggregati (ecg_orari, turni, cardiologists) ── */
      _supabaseClient
        .channel('ecg-orari-' + _weekKey)
        .on(
          'postgres_changes',
          {
            event: '*',
            schema: 'public',
            table: 'kv_store',
            filter: 'id=eq.ecg_orari/' + _weekKey
          },
          function(payload) {
            console.log('[Realtime] ecg_orari aggiornato:', payload.eventType);
            if (!window._lastCalData) return;
            var newData = payload.new && payload.new.data ? payload.new.data : null;
            if (newData) {
              window._lastCalData.ecgOrari = newData;
              processAndRender(window._lastCalData);
            }
          }
        )
        .subscribe(function(status) {
          console.log('[Realtime] ecg_orari canale →', status);
        });

      /* ── 4. kv_store → turni_medici/turni (aggiornamenti turni da Situazione-medici) ── */
      _supabaseClient
        .channel('turni-live')
        .on(
          'postgres_changes',
          {
            event: '*',
            schema: 'public',
            table: 'kv_store',
            filter: 'id=eq.turni_medici/turni'
          },
          function(payload) {
            console.log('[Realtime] turni aggiornati:', payload.eventType);
            if (!window._lastCalData) return;
            var newData = payload.new && payload.new.data ? payload.new.data : null;
            if (newData) {
              window._lastCalData.turni = newData.lista || [];
              processAndRender(window._lastCalData);
            }
          }
        )
        .subscribe(function(status) {
          console.log('[Realtime] turni canale →', status);
        });

      /* ── 5. kv_store → turni_medici/cardiologists ── */
      _supabaseClient
        .channel('cardiologists-live')
        .on(
          'postgres_changes',
          {
            event: '*',
            schema: 'public',
            table: 'kv_store',
            filter: 'id=eq.turni_medici/cardiologists'
          },
          function(payload) {
            console.log('[Realtime] cardiologists aggiornati:', payload.eventType);
            if (!window._lastCalData) return;
            var newData = payload.new && payload.new.data ? payload.new.data : null;
            if (newData) {
              window._lastCalData.cardiologists = newData.lista || [];
              processAndRender(window._lastCalData);
            }
          }
        )
        .subscribe(function(status) {
          console.log('[Realtime] cardiologists canale →', status);
        });
    })();
  });

  function scheduleRefresh() {
    nextRefresh = Date.now() + REFRESH_INTERVAL_MS;
    setTimeout(function() {
      reloadTurni();
      scheduleRefresh();
    }, REFRESH_INTERVAL_MS);
  }
  scheduleRefresh();

  setInterval(updateClock, 1000);
  updateClock();
  setInterval(updateEcgDots, 60000);

  // Anti-freeze TV: tocca il DOM ogni 15s
  setInterval(function() {
    var bar = document.getElementById('rainbow-bar');
    bar.style.opacity = '0.99';
    setTimeout(function() { bar.style.opacity = '1'; }, 100);
  }, 15000);

  // Watchdog logo
  var logoSrc = document.getElementById('footer-logo-img').src;
  setInterval(function() {
    var img = document.getElementById('footer-logo-img');
    if (!img.src || img.src.length < 100 || img.naturalWidth === 0) {
      img.src = logoSrc;
    }
  }, 5000);
})();

</script>
